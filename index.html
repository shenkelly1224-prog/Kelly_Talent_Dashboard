<title>Kelly 人才盘点与继任管理</title>
<style>
:root {
  --navy:#0F1F3A;--navy-light:#1A3353;--navy-deep:#0A1530;
  --accent:#C9A227;--accent-light:#E6C75A;
  --success:#2D6A4F;--warning:#B85C14;--danger:#9B2335;
  --text:#1A1A2E;--text-secondary:#6B7280;--text-light:#9CA3AF;
  --bg:#FFF;--bg-warm:#FAFAF8;--bg-page:#F4F5F7;
  --border:#E5E7EB;--border-light:#F3F4F6;
  --radius:8px;--radius-sm:5px;--sidebar-w:244px;
  --shadow-sm:0 1px 3px rgba(15,31,58,.06);--shadow:0 2px 8px rgba(15,31,58,.08);--shadow-lg:0 8px 32px rgba(15,31,58,.14);
}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;background:var(--bg-page);color:var(--text);line-height:1.6;font-size:14px}
#roleGate{position:fixed;inset:0;background:linear-gradient(135deg,var(--navy-deep) 0%,var(--navy) 50%,var(--navy-light) 100%);display:flex;align-items:center;justify-content:center;z-index:200}
#roleGate.hidden{display:none}
.gate-card{width:840px;max-width:92vw}
.gate-logo{text-align:center;margin-bottom:36px}
.gate-logo .icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:inline-flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px rgba(201,162,39,.3);margin-bottom:14px}
.gate-logo h1{color:#fff;font-size:22px;font-weight:600}
.gate-logo p{color:rgba(255,255,255,.55);font-size:13px;margin-top:4px}
.gate-choices{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gate-choice{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:32px 28px;cursor:pointer;transition:all .25s}
.gate-choice:hover{background:rgba(255,255,255,.12);border-color:var(--accent);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.gate-choice .gc-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px}
.gate-choice.evaluator .gc-icon{background:rgba(45,106,79,.25);color:#6EE7B7}
.gate-choice.hrbp .gc-icon{background:rgba(201,162,39,.22);color:var(--accent-light)}
.gate-choice h2{color:#fff;font-size:17px;margin-bottom:6px}
.gate-choice p{color:rgba(255,255,255,.5);font-size:12px;line-height:1.7}
.gate-pwd-area{margin-top:18px;display:none}.gate-pwd-area.show{display:block}
.gate-pwd-input{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:15px;text-align:center;letter-spacing:3px;outline:none}
.gate-pwd-input::placeholder{color:rgba(255,255,255,.35)}
.gate-pwd-input:focus{border-color:var(--accent);background:rgba(255,255,255,.12)}
.gate-pwd-btn{width:100%;margin-top:12px;padding:12px;border:none;border-radius:8px;background:var(--accent);color:var(--navy);font-weight:600;font-size:14px;cursor:pointer}
.gate-pwd-btn:hover{background:var(--accent-light)}
.gate-err{color:#FCA5A5;font-size:12px;margin-top:8px;display:none}.gate-err.show{display:block}
.gate-footer{text-align:center;margin-top:30px;color:rgba(255,255,255,.3);font-size:11px}
#appShell{display:none;height:100vh}#appShell.show{display:flex}
.sidebar{width:var(--sidebar-w);background:var(--navy-deep);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sidebar-brand .title{color:#fff;font-size:14px;font-weight:600;line-height:1.3}
.sidebar-brand .title .sub{font-size:10px;font-weight:400;color:rgba(255,255,255,.45);display:block;margin-top:1px}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.sidebar-nav::-webkit-scrollbar{width:5px}.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.nav-group{margin-bottom:6px}
.nav-group-label{padding:14px 22px 6px;font-size:10px;font-weight:600;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 22px;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(201,162,39,.12);color:var(--accent-light);border-left-color:var(--accent);font-weight:500}
.nav-item .ni-icon{width:18px;text-align:center;font-size:14px;opacity:.8}.nav-item.active .ni-icon{opacity:1}
.nav-badge{margin-left:auto;font-size:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:1px 6px;border-radius:8px}
.sidebar-footer{padding:12px 20px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between}
.sidebar-footer .role-dot{width:8px;height:8px;border-radius:50%}
.sidebar-footer .role-dot.eval{background:#6EE7B7}.sidebar-footer .role-dot.hrbp{background:var(--accent-light)}
.sidebar-footer .role-name{color:rgba(255,255,255,.6);font-size:12px}
.sidebar-footer .switch-btn{color:rgba(255,255,255,.4);font-size:11px;cursor:pointer;background:none;border:none}
.sidebar-footer .switch-btn:hover{color:#fff}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;box-shadow:var(--shadow-sm)}
.topbar .tb-title{font-size:16px;font-weight:600;color:var(--navy)}
.topbar .tb-sub{font-size:12px;color:var(--text-light);margin-left:10px}
.topbar .tb-right{display:flex;align-items:center;gap:10px}
.topbar .tb-user{font-size:12px;color:var(--text-secondary)}
.content-area{flex:1;overflow-y:auto;padding:24px}
.content-area::-webkit-scrollbar{width:7px}.content-area::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:4px}
.view{display:none;max-width:1200px;margin:0 auto}.view.active{display:block;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.panel-header{background:var(--bg-warm);padding:13px 18px;font-size:14px;font-weight:600;color:var(--navy);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.panel-body{padding:18px}
.btn{padding:8px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;transition:all .15s;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-light)}
.btn-accent{background:var(--accent);color:var(--navy)}.btn-accent:hover{background:var(--accent-light)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{filter:brightness(1.1)}
.btn-danger{background:var(--danger);color:#fff}
.btn-secondary{background:#E5E7EB;color:var(--text-secondary)}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--navy-light);color:var(--navy)}
.btn-sm{padding:5px 11px;font-size:12px}.btn-large{padding:12px 28px;font-size:15px}
.btn-group{display:flex;gap:10px;flex-wrap:wrap}
table.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--navy);color:#fff;padding:9px 12px;text-align:left;font-weight:500;font-size:12px;white-space:nowrap}
.data-table td{padding:9px 12px;border-bottom:1px solid var(--border-light)}
.data-table tr:hover{background:#F8FAFC}.data-table tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600}
.tag.high{background:#DCFCE7;color:var(--success)}.tag.mid{background:#FEF3C7;color:var(--warning)}.tag.low{background:#FEE2E2;color:var(--danger)}.tag.missing{background:#E5E7EB;color:var(--text-secondary)}
.tag.star{background:#DCFCE7;color:var(--success);border:1px solid var(--success)}.tag.hipo{background:#DBEAFE;color:#1E40AF;border:1px solid #1E40AF}.tag.core{background:#FEF3C7;color:var(--warning);border:1px solid var(--warning)}
.tag.solid{background:#F3F4F6;color:var(--text-secondary)}.tag.basic{background:#FEE2E2;color:var(--danger)}
.toast{position:fixed;top:20px;right:20px;background:var(--success);color:#fff;padding:12px 20px;border-radius:var(--radius);font-size:14px;z-index:500;display:none;box-shadow:var(--shadow-lg)}
.toast.show{display:block;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-light)}
.empty-state .es-icon{font-size:42px;margin-bottom:12px}
.input,.textarea-field,select.input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;background:#fff;outline:none;transition:border-color .15s}
.input:focus,.textarea-field:focus,select.input:focus{border-color:var(--navy-light)}
.textarea-field{resize:vertical;min-height:60px;line-height:1.6}
.form-label{font-size:12px;color:var(--text-light);display:block;margin-bottom:5px;font-weight:500}
.form-row{margin-bottom:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hint-box{background:#FFF7ED;border-left:3px solid var(--warning);padding:11px 14px;border-radius:0 6px 6px 0;font-size:12px;color:var(--text-secondary);line-height:1.7;margin:10px 0}
.hint-box strong{color:var(--navy)}
.modal-overlay{position:fixed;inset:0;background:rgba(10,21,48,.5);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal.modal-lg{max-width:820px}
.modal-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:16px;color:var(--navy)}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-light);padding:4px}.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:28px 20px;text-align:center;background:var(--bg-warm);cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--navy-light);background:#F0F9FF}
.upload-area.dragover{border-color:var(--accent);background:#FFFBEB}
.upload-area input{display:none}
.upload-area .ua-icon{font-size:26px;margin-bottom:8px}
.upload-area .ua-title{font-size:13px;font-weight:500;color:var(--navy);margin-bottom:3px}
.upload-area .ua-desc{font-size:11px;color:var(--text-light)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center}
.stat-card .sc-num{font-size:30px;font-weight:700;color:var(--navy)}
.stat-card .sc-num.accent{color:var(--accent)}.stat-card .sc-num.success{color:var(--success)}.stat-card .sc-num.danger{color:var(--danger)}
.stat-card .sc-label{font-size:12px;color:var(--text-light);margin-top:4px}
.tab-bar{display:flex;gap:4px;background:#fff;padding:4px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px}
.tab-bar .tab{padding:8px 16px;border-radius:5px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--text-light)}
.tab-bar .tab.active{background:var(--navy);color:#fff}
.grid-2col{display:grid;grid-template-columns:300px 1fr;gap:20px}
.matrix-big{display:grid;grid-template-columns:90px repeat(3,1fr);grid-template-rows:44px repeat(3,auto);gap:6px;max-width:920px;margin:0 auto}
.matrix-big .m-corner{background:transparent}
.matrix-big .m-label{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--navy)}
.matrix-big .m-cell{border-radius:6px;padding:12px;min-height:90px;transition:all .2s;position:relative}
.matrix-big .m-cell.drag-over{box-shadow:0 0 0 3px var(--accent);transform:scale(1.02)}
.matrix-big .m-cell .cell-title{font-size:11px;font-weight:600;margin-bottom:6px}
.matrix-big .m-cell .names{font-size:11px;line-height:1.9}
.matrix-big .m-cell .names .name-tag{display:inline-block;background:#fff;padding:2px 7px;border-radius:4px;margin:2px;border:1px solid rgba(0,0,0,.08);cursor:grab;transition:all .15s}
.matrix-big .m-cell .names .name-tag:hover{background:var(--navy);color:#fff}
.matrix-big .m-cell .names .name-tag.moved{border:2px solid var(--accent);background:#FFFBEB;color:var(--navy);font-weight:600}
.matrix-big .m-cell.star{background:#DCFCE7;color:var(--success)}
.matrix-big .m-cell.hipo{background:#DBEAFE;color:#1E40AF}
.matrix-big .m-cell.core{background:#FEF3C7;color:var(--warning)}
.matrix-big .m-cell.solid{background:#F3F4F6;color:var(--text-secondary)}
.matrix-big .m-cell.basic{background:#FEE2E2;color:var(--danger)}
.wizard-steps{display:flex;margin-bottom:24px}
.wizard-step{flex:1;text-align:center;padding:12px;border-bottom:2px solid var(--border);font-size:12px;color:var(--text-light)}
.wizard-step.active{border-bottom-color:var(--accent);color:var(--navy);font-weight:600}
.wizard-step.done{border-bottom-color:var(--success);color:var(--success)}
.opt-btn{padding:6px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;cursor:pointer;font-size:13px;transition:all .15s;min-width:56px;text-align:center}
.opt-btn:hover{border-color:var(--navy-light)}
.opt-btn.selected-yes{background:var(--success);color:#fff;border-color:var(--success)}
.opt-btn.selected-no{background:#E5E7EB;color:var(--text-secondary)}
.readiness-row{border:1px solid var(--border);border-radius:5px;padding:8px;background:#fff;min-height:50px;margin-top:6px}
.readiness-row .r-title{font-size:10px;color:var(--text-light);font-weight:600;margin-bottom:6px;text-align:center;border-bottom:1px solid var(--border-light);padding-bottom:4px}
.readiness-row .r-names{font-size:11px;text-align:center;min-height:20px}
.risk-indicator{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.risk-high{background:#FEE2E2;color:var(--danger)}.risk-mid{background:#FEF3C7;color:var(--warning)}.risk-low{background:#DCFCE7;color:var(--success)}
@media (max-width:1024px){.grid-2col{grid-template-columns:1fr}}
@media (max-width:768px){.sidebar{display:none}.stat-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.gate-choices{grid-template-columns:1fr}}

:root{--radius:10px;--radius-lg:14px;--shadow-sm:0 1px 2px rgba(15,31,58,.05),0 1px 3px rgba(15,31,58,.07);--shadow:0 4px 14px rgba(15,31,58,.07);--shadow-lg:0 14px 40px rgba(10,21,48,.18);--bg-page:#F5F6F8}
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#roleGate{background:radial-gradient(circle at 30% 20%,#16294a 0,var(--navy-deep) 55%)}
.gate-card{animation:gateIn .5s cubic-bezier(.2,.7,.3,1)}
@keyframes gateIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.gate-choice{backdrop-filter:blur(4px)}
.gate-logo .icon{box-shadow:0 10px 28px rgba(201,162,39,.35)}
.sidebar{background:linear-gradient(180deg,#0B1A38 0%,var(--navy-deep) 100%)}
.nav-item.active{background:linear-gradient(90deg,rgba(201,162,39,.16),rgba(201,162,39,.04))}
.topbar{background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(6px)}
.panel{border-radius:var(--radius-lg);box-shadow:var(--shadow);border-color:#EDF0F4}
.panel-header{background:linear-gradient(180deg,#FBFCFD,#F4F6F9);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.stat-card{border-radius:var(--radius-lg);transition:transform .18s,box-shadow .18s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-card .sc-num{font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.btn{border-radius:7px;font-weight:500;transition:transform .12s,box-shadow .15s,background .15s,filter .15s}
.btn:hover{box-shadow:0 2px 8px rgba(15,31,58,.12)}
.btn-primary{box-shadow:0 2px 8px rgba(15,31,58,.16)}
.btn-accent{box-shadow:0 2px 8px rgba(201,162,39,.3)}
.btn-success{box-shadow:0 2px 8px rgba(45,106,79,.25)}
.data-table{border-radius:var(--radius);overflow:hidden}
.data-table th{background:linear-gradient(180deg,#16294a,var(--navy));font-weight:500;letter-spacing:.2px}
.data-table tbody tr{transition:background .12s}
.data-table tbody tr:nth-child(even){background:#FAFBFC}
.data-table tbody tr:hover{background:#EEF4FB}
.matrix-big .m-cell{border-radius:var(--radius);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.matrix-big .m-cell .name-tag{border-radius:6px;font-weight:500;transition:transform .12s,box-shadow .12s}
.matrix-big .m-cell .name-tag:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(15,31,58,.18)}
.input,.textarea-field,select.input{border-radius:7px;transition:border-color .15s,box-shadow .15s}
.input:focus,.textarea-field:focus,select.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.tag{border-radius:11px;letter-spacing:.2px}
.hint-box{border-radius:0 8px 8px 0}
.upload-area{border-radius:var(--radius);transition:transform .15s,border-color .15s,background .15s}
.upload-area:hover{transform:translateY(-1px)}
.empty-state .es-icon{opacity:.85;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.idp-table .idp-editor-row>td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -1px 0 var(--border)}
.toast{border-radius:var(--radius);box-shadow:var(--shadow-lg)}
.content-area{scroll-behavior:smooth}
.opt-btn{border-radius:7px;font-weight:500}

</style>
</head>
<body>
<div id="roleGate"><div class="gate-card"><div class="gate-logo"><div class="icon">🎯</div><h1>Kelly 人才盘点与继任管理</h1><p>一体化人才盘点 · 评估 · 校准 · 发展</p></div><div class="gate-choices"><div class="gate-choice evaluator" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}" onclick="gateChoose('evaluator')"><div class="gc-icon">📋</div><h2>我是评估人</h2><p>业务管理者。选择本人姓名并验证后，对下属进行潜力、离职风险及接班准备度评估。</p></div><div class="gate-choice hrbp" role="button" tabindex="0" onkeydown="if(event.target===this&&(event.key==='Enter'||event.key===' ')){event.preventDefault();this.click()}" onclick="gateChoose('hrbp')"><div class="gc-icon">🔑</div><h2>我是项目主理人</h2><p>HR / HRBP。配置工具、导入人员数据、分发评估、汇总校准、生成报告。</p><div class="gate-pwd-area" id="gatePwdArea" onclick="event.stopPropagation()"></div></div></div><div class="gate-footer"><a href="en/" style="color:#E6C75A">English</a><br>数据仅存储在本地浏览器，不经过任何网络传输 · 首次进入项目主理人请设置密码</div></div></div><div id="appShell"><div class="sidebar"><div class="sidebar-brand"><div class="logo">🎯</div><div class="title">Kelly 人才盘点<span class="sub" id="sbProjectName">Talent Review</span></div></div><nav class="sidebar-nav" id="sidebarNav"></nav><div class="sidebar-footer"><div style="display:flex;align-items:center;gap:8px;"><span class="role-dot" id="roleDot"></span><span class="role-name" id="roleName">--</span></div><button class="switch-btn" onclick="switchRole()">切换 ↻</button></div><div style="padding:0 20px 8px;"><button class="switch-btn" id="footerGuideBtn" onclick="startGuideForRole()" style="display:none;font-size:11px;">📖 新手引导</button></div></div><div class="main-area"><div class="topbar"><div style="display:flex;align-items:center;"><span class="tb-title" id="tbTitle">--</span><span class="tb-sub" id="tbSub"></span></div><div class="tb-right" id="tbRight"></div></div><div class="content-area" id="contentArea"></div></div></div><div class="toast" id="toast"></div><div class="modal-overlay" id="wizardOverlay"><div class="modal modal-lg"><div class="modal-header"><h3>⚙️ 工具配置向导</h3><button class="modal-close" onclick="wizardClose()">✕</button></div><div class="modal-body" id="wizardBody"></div></div></div><div class="modal-overlay" id="genericOverlay"><div class="modal" id="genericModal"><div class="modal-header"><h3 id="genericTitle">--</h3><button class="modal-close" onclick="closeGeneric()">✕</button></div><div class="modal-body" id="genericBody"></div><div class="modal-footer" id="genericFooter"></div></div></div><script id="tr-embedded-data" type="application/json"></script>
<script>
/* ============================================================
   Kelly Talent Review — Unified Engine
   Merges assessment tool + report generator into one app
   with role-based views, sidebar navigation, and new modules
   ============================================================ */

/* ---------- DEFAULT CONFIG ---------- */
const DEFAULT_CONFIG = {
  orgName: "（待配置）", projectName: "Kelly 人才盘点", ownerName: "",
  levelManager: "直接上级", levelAssessed: "下属", teamColumn: "部门",
  levelOptions: ["N-1", "N-2", "N-3"],
  perfScale: [
    { label: "S", score: 5 }, { label: "A", score: 4 },
    { label: "B", score: 3 }, { label: "C", score: 2 }, { label: "D", score: 1 }
  ],
  perfWeights: [0.2, 0.3, 0.5],
  perfThresholdHigh: 4.0, perfThresholdMid: 2.5,
  potThresholdHigh: 12, potThresholdMid: 8,
  potPointsPerYes: 1,
  potentialDims: [
    { name: "学习与成长潜力", questions: ["该员工是否主动学习新知识、新技能，并能快速应用到工作中？", "该员工是否经常分享学习经验，带动团队共同成长？", "该员工是否在短时间内掌握新领域知识？", "该员工对新知识有强烈的求知欲和学习能力？"] },
    { name: "动机与抱负", questions: ["该员工是否有强烈的成就动机，不断设定更高目标？", "该员工是否主动追求更高的职位和责任？", "该员工是否有清晰的3-5年职业规划？", "该员工是否积极寻找发展机会和挑战？"] },
    { name: "适应与变革能力", questions: ["该员工是否主动提出创新建议和改进方案？", "该员工是否在不确定环境中能果断决策？", "该员工是否积极推动团队适应变化？", "该员工是否创新尝试多，敢于打破常规？"] },
    { name: "协作与影响力", questions: ["该员工是否能够跨部门高效协作，建立广泛的人脉网络？", "该员工是否有较强的影响力，能推动他人达成共识？", "该员工是否善于沟通和表达，团队关系良好？", "该员工是否能够领导项目和团队，带领团队取得成果？"] }
  ],
  riskQuestions: [
    "近期是否主动提到职业倦怠或想换环境", "是否对当前工作内容明显缺乏热情",

    "是否与直属上级关系紧张", "是否表达过明确的离职倾向",
    "是否有猎头频繁联系或外部机会", "是否家庭/个人原因可能影响留任"
  ]
};
let ACTIVE_CONFIG = null;

/* ---------- DATA MODEL ---------- */
let employees = [];        // personnel list
let eltList = [];          // evaluators (also key positions in v1)
let reportingMap = {};     // evaluatorId -> [empId,...]
let evaluatorPasswords = {};
let savedAssessments = []; // assessment results
let csvData = [];          // merged/parsed assessment data for reports
let hrbpData = [];         // HRBP risk data
let successionData = {};   // { eltId: { now:[], '1-3':[], '3+':[] } }
let manualMoves = {};      // { empId: { pot:'high', perf:'high' } }
let keyPositions = [];     // key position management
let batchRecords = [];     // historical snapshots
let devPlans = {};         // { empId: { goals, actions, timeline, notes } }
let operationLog = [];     // operation log entries
let currentRole = null;    // 'evaluator' | 'hrbp'
let currentEvaluator = null;
let evaluatorVerified = false;
let currentView = null;

const DATA_KEY = 'kelly_trp_data_v1';
const CFG_KEY = 'kelly_trp_config_v1';

/* ---------- CONFIG HELPERS ---------- */
function loadConfig() {
  const s = localStorage.getItem(CFG_KEY);
  if (s) { try { return JSON.parse(s); } catch(e){} }
  const em = document.getElementById('tr-embedded-data');
  if (em && em.textContent.trim()) { try { const d = JSON.parse(em.textContent); if (d.config) return d.config; } catch(e){} }
  return null;
}
function getConfig() {
  if (ACTIVE_CONFIG) return ACTIVE_CONFIG;
  ACTIVE_CONFIG = loadConfig() || JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  return ACTIVE_CONFIG;
}
function saveConfig(cfg) { ACTIVE_CONFIG = cfg; localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); logOp('保存配置'); }
/* auto-calculate potential max score: total questions × points per yes */
function calcPotMax(cfg) {
  const total = cfg.potentialDims.reduce((s, d) => s + d.questions.length, 0);
  return total * (cfg.potPointsPerYes || 1);
}
function perfToScore(val) {
  if (!val) return 0;
  const cfg = getConfig();
  const hit = cfg.perfScale.find(p => p.label === String(val).trim());
  return hit ? hit.score : 0;
}
function calcPerfScore(a, b, c) {
  const cfg = getConfig(), w = cfg.perfWeights;
  const s = [perfToScore(a), perfToScore(b), perfToScore(c)];
  const pairs = s.map((v,i)=>({v,w:w[i]})).filter(p=>p.v>0);
  if (pairs.length === 0) return "";
  const sumW = pairs.reduce((t,p)=>t+p.w,0);
  return (pairs.reduce((t,p)=>t+p.v*(p.w/sumW),0)).toFixed(1);
}
function calcPerfLevel(a, b, c) {
  const sc = calcPerfScore(a,b,c);
  if (!sc) return "缺失";
  const n = parseFloat(sc);
  const cfg = getConfig();
  if (n >= cfg.perfThresholdHigh) return "高";
  if (n >= cfg.perfThresholdMid) return "中";
  return "低";
}

/* ---------- STORAGE ---------- */
function loadAllData() {
  try {
    const s = localStorage.getItem(DATA_KEY);
    if (s) {
      const d = JSON.parse(s);
      employees = d.employees || [];
      eltList = d.eltList || [];
      reportingMap = d.reportingMap || {};
      evaluatorPasswords = d.evaluatorPasswords || {};
      keyPositions = d.keyPositions || [];
      batchRecords = d.batchRecords || [];
      devPlans = d.devPlans || {};
      operationLog = d.operationLog || [];
      return true;
    }
  } catch(e) { console.error('loadAllData:', e); }
  return false;
}
function saveAllData() {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify({
      employees, eltList, reportingMap, evaluatorPasswords,
      keyPositions, batchRecords, devPlans, operationLog,
      savedAt: new Date().toISOString()
    }));
  } catch(e) { console.error('saveAllData:', e); }
}
function loadAssessments() {
  try { savedAssessments = JSON.parse(localStorage.getItem('kelly_trp_assessments_v1') || '[]'); } catch(e) { savedAssessments = []; }
}
function saveAssessments() { localStorage.setItem('kelly_trp_assessments_v1', JSON.stringify(savedAssessments)); }

function logOp(msg) {
  operationLog.unshift({ time: new Date().toLocaleString('zh-CN'), action: msg, role: currentRole });
  if (operationLog.length > 200) operationLog = operationLog.slice(0, 200);
  saveAllData();
}

/* ---------- ROLE GATE ---------- */
function gateChoose(role) {
  if (role === 'hrbp') {
    gateShowPwdArea();
    setTimeout(()=>{const i=document.getElementById('gatePwdInput'); if(i) i.focus();}, 100);
  } else {
    enterEvaluatorMode();
  }
}
function gateShowPwdArea() {
  const area = document.getElementById('gatePwdArea');
  if (!area) return;
  const setMode = !hasHrbpPassword();
  area.classList.add('show');
  area.innerHTML =
    '<input type="password" class="gate-pwd-input" id="gatePwdInput" placeholder="'+(setMode?'设置项目主理人密码':'输入项目主理人密码')+'" maxlength="20" onkeydown="if(event.key===\'Enter\')'+(setMode?'gateCreatePassword()':'gateVerify()')+'">' +
    (setMode ? '<input type="password" class="gate-pwd-input" id="gatePwdConfirm" placeholder="再次输入确认密码" maxlength="20" style="margin-top:10px;" onkeydown="if(event.key===\'Enter\')gateCreatePassword()">' : '') +
    '<button class="gate-pwd-btn" onclick="'+(setMode?'gateCreatePassword()':'gateVerify()')+'">'+(setMode?'设 置 并 进 入':'进 入 平 台')+'</button>' +
    (setMode ? '<div style="margin-top:10px;font-size:11px;color:rgba(255,255,255,.45);text-align:center;">首次使用请设置密码，之后凭此密码登录</div>' : '<div style="margin-top:10px;text-align:center;"><span style="font-size:11px;color:rgba(255,255,255,.45);cursor:pointer;text-decoration:underline;" onclick="gateShowReset()">忘记密码？重置</span></div>') +
    '<div class="gate-err" id="gateErr"></div>';
}
function hasHrbpPassword() { return !!localStorage.getItem('kelly_trp_dev_pwd'); }
/* password is user-set (first entry) and stored locally; no random fallback */
function gateVerify() {
  const input = document.getElementById('gatePwdInput').value;
  const pwd = localStorage.getItem('kelly_trp_dev_pwd');
  if (pwd && input === pwd) { enterHrbpMode(); }
  else { const e=document.getElementById('gateErr'); if(e){e.textContent='密码错误，请重试';e.classList.add('show');} }
}
function gateCreatePassword() {
  const p1 = document.getElementById('gatePwdInput').value;
  const p2 = document.getElementById('gatePwdConfirm').value;
  const err = document.getElementById('gateErr');
  if (!p1 || p1.length < 4) { if(err){err.textContent='密码至少 4 位';err.classList.add('show');} return; }
  if (p1 !== p2) { if(err){err.textContent='两次输入不一致';err.classList.add('show');} return; }
  localStorage.setItem('kelly_trp_dev_pwd', p1);
  enterHrbpMode();
}
/* reset: wipes all local data so the tool returns to first-run, then shows set-password again */
function gateResetStart() {
  if (!confirm('重置将清空本浏览器中的全部数据（人员、评估、配置、分发表格、密码等）并恢复到首次进入状态。此操作不可恢复，确定继续？')) return;
  // Clear ALL kelly_trp_ prefixed localStorage keys (data, config, assessments, guide flags, password)
  var toRemove = [];
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    if (k && k.indexOf('kelly_trp_') === 0) toRemove.push(k);
  }
  toRemove.forEach(function(k) { localStorage.removeItem(k); });
  // Full page reload to reset all in-memory state and return to first-run
  location.reload();
}
function gateShowReset() {
  gateResetStart();
}
function enterHrbpMode() {
  currentRole = 'hrbp'; currentEvaluator = null; evaluatorVerified = false;
  document.getElementById('roleGate').classList.add('hidden');
  document.getElementById('appShell').classList.add('show');
  loadAllData(); loadAssessments();
  updateRoleIndicator();
  renderSidebar();
  logOp('项目主理人登录');
  // first-time: open config wizard if no data
  if (employees.length === 0) { navigate('settings-config'); setTimeout(()=>wizardOpen(), 300); }
  else { navigate('settings-config'); if (!localStorage.getItem('kelly_trp_guide_done_hrbp')) setTimeout(startHrbpGuide, 500); }
}
function enterEvaluatorMode() {
  loadAllData(); loadAssessments();
  if (eltList.length === 0) { alert('尚未导入人员数据，请联系项目主理人分发评估文件。'); return; }
  showEvaluatorLogin();
}
function showEvaluatorLogin() {
  const ov = document.getElementById('genericOverlay');
  const opts = eltList.map(e => '<option value="'+e.id+'">'+e.name+(e.title?(' — '+e.title):'')+'</option>').join('');
  document.getElementById('genericTitle').textContent = '📋 选择评估人';
  document.getElementById('genericBody').innerHTML =
    '<div class="form-row"><label class="form-label">请选择您的姓名</label><select class="input" id="evSelect">'+opts+'</select></div>' +
    '<div class="form-row"><label class="form-label">4位密码</label><input type="password" class="input" id="evPwd" maxlength="4" placeholder="输入4位密码" onkeydown="if(event.key===\'Enter\')confirmEvaluator()"></div>' +
    '<div id="evErr" style="color:var(--danger);font-size:12px;display:none;">密码错误</div>';
  document.getElementById('genericFooter').innerHTML = '<button class="btn btn-primary" onclick="confirmEvaluator()">验证并进入</button>';
  ov.classList.add('show');
}
function confirmEvaluator() {
  const id = document.getElementById('evSelect').value;
  const pwd = document.getElementById('evPwd').value;
  if (evaluatorPasswords[id] && String(evaluatorPasswords[id]) === pwd) {
    currentEvaluator = eltList.find(e => e.id === id);
    currentRole = 'evaluator'; evaluatorVerified = true;
    closeGeneric();
    document.getElementById('roleGate').classList.add('hidden');
    document.getElementById('appShell').classList.add('show');
    updateRoleIndicator();
    renderSidebar();
   logOp('评估人登录: ' + currentEvaluator.name);
   navigate('assess-tool');
    if (!localStorage.getItem('kelly_trp_guide_done_evaluator')) setTimeout(startEvaluatorGuide, 500);
  } else {
    document.getElementById('evErr').style.display = 'block';
  }
}
function switchRole() {
  if (!confirm('确定要切换角色吗？未保存的数据可能丢失。')) return;
  currentRole = null; currentEvaluator = null; evaluatorVerified = false;
  document.getElementById('appShell').classList.remove('show');
  document.getElementById('roleGate').classList.remove('hidden');
  document.getElementById('gatePwdArea').classList.remove('show');
  document.getElementById('gatePwdInput').value = '';
  document.getElementById('gateErr').classList.remove('show');
}
function updateRoleIndicator() {
  const dot = document.getElementById('roleDot');
  const nm = document.getElementById('roleName');
  if (currentRole === 'hrbp') { dot.className = 'role-dot hrbp'; nm.textContent = '项目主理人'; }
  else if (currentRole === 'evaluator') { dot.className = 'role-dot eval'; nm.textContent = '评估人 · ' + (currentEvaluator?currentEvaluator.name:''); }
}

function startGuideForRole() {
  if (currentRole === 'evaluator') startEvaluatorGuide();
  else if (currentRole === 'hrbp') startHrbpGuide();
}

/* ---------- NAVIGATION ---------- */

};
function renderSidebar() {
  const nav = NAV_STRUCTURE[currentRole] || [];
  let html = '';
  nav.forEach(g => {
    html += '<div class="nav-group"><div class="nav-group-label">'+g.group+'</div>';
    g.items.forEach(it => {
      const badge = it.id === 'assess-tool' && currentRole === 'evaluator'
        ? '<span class="nav-badge">'+getMyTeamCount()+'</span>' : '';
      html += '<div class="nav-item'+(currentView===it.id?' active':'')+'" onclick="navigate(\''+it.id+'\')"><span class="ni-icon">'+it.icon+'</span><span>'+it.label+'</span>'+badge+'</div>';
    });
    html += '</div>';
  });
  document.getElementById('sidebarNav').innerHTML = html;
  // Add guide button to sidebar footer for quick access
  var footerGuide = document.getElementById('footerGuideBtn');
  if (footerGuide) {
    footerGuide.style.display = currentRole ? '' : 'none';
  }
  const pn = document.getElementById('sbProjectName');
  const cfg = getConfig(); pn.textContent = cfg.projectName || 'Talent Review';
}
function getMyTeamCount() {
  if (!currentEvaluator) return '';
  const ids = reportingMap[currentEvaluator.id] || [];
  const assessed = savedAssessments.filter(a => ids.includes(a.empId) && a.evaluatorId === currentEvaluator.id);
  return assessed.length + '/' + ids.length;
}
function navigate(viewId) {
  currentView = viewId;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  // re-render sidebar to update active state
  renderSidebar();
  const meta = VIEW_META[viewId] || { title: viewId, sub:'' };
  document.getElementById('tbTitle').textContent = meta.title;
  document.getElementById('tbSub').textContent = meta.sub;
  const renderFn = VIEW_RENDERERS[viewId];
  if (renderFn) renderFn();
  else document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="es-icon">🚧</div><div class="es-title">模块开发中</div></div>';
  document.getElementById('contentArea').scrollTop = 0;
}
function setTopbarRight(html) { document.getElementById('tbRight').innerHTML = html; }

/* ---------- TOAST & MODAL ---------- */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function closeGeneric() { document.getElementById('genericOverlay').classList.remove('show'); }

function wzUpdatePotStats() {
  const dims = document.querySelectorAll('#wzDimList .wz-dim-name');
  const qs = document.querySelectorAll('#wzDimList .wz-dim-q');
  const ppy = parseFloat(document.getElementById('wzPotPointsPerYes')?.value) || 1;
  const dc = document.getElementById('wzDimCount'); if (dc) dc.textContent = dims.length;
  const qc = document.getElementById('wzQCount'); if (qc) qc.textContent = qs.length;

function wizardSave() {
  // collect step 3 data (we're on step 3 right now, DOM has step 3 elements)
  _wizardDraft.dimData = [...document.querySelectorAll('#wzDimList .panel')].map(p => {
    const name = p.querySelector('.wz-dim-name').value.trim();
    const qs = [...p.querySelectorAll('.wz-dim-q')].map(e=>e.value.trim()).filter(Boolean);
    return { name, questions: qs };
  }).filter(d=>d.name);
  _wizardDraft.potPointsPerYes = val('wzPotPointsPerYes');
  _wizardDraft.potThresholdHigh = val('wzPotThreshHigh');
  _wizardDraft.potThresholdMid = val('wzPotThreshMid');
  _wizardDraft.riskQuestions = [...document.querySelectorAll('.wz-risk-q')].map(e=>e.value.trim()).filter(Boolean);

  // apply all collected draft data to config
  const cfg = getConfig();
  if (_wizardDraft.orgName !== undefined) cfg.orgName = _wizardDraft.orgName || cfg.orgName;
  if (_wizardDraft.projectName !== undefined) cfg.projectName = _wizardDraft.projectName || cfg.projectName;
  if (_wizardDraft.levelManager !== undefined) cfg.levelManager = _wizardDraft.levelManager || cfg.levelManager;
  if (_wizardDraft.levelAssessed !== undefined) cfg.levelAssessed = _wizardDraft.levelAssessed || cfg.levelAssessed;
  if (_wizardDraft.teamColumn !== undefined) cfg.teamColumn = _wizardDraft.teamColumn || cfg.teamColumn;
  if (_wizardDraft.levelOptions && _wizardDraft.levelOptions.length) cfg.levelOptions = _wizardDraft.levelOptions;

  if (_wizardDraft.perfLabels) {
    cfg.perfScale = _wizardDraft.perfLabels.map((l,i)=>({label:l, score:_wizardDraft.perfScores[i]||0}));
    const wStr = _wizardDraft.perfWeights || '0.2 / 0.3 / 0.5';
    cfg.perfWeights = wStr.split(/[\/,]/).map(s=>parseFloat(s.trim())||0);
    cfg.perfThresholdHigh = parseFloat(_wizardDraft.perfThresholdHigh) || 4.0;
    cfg.perfThresholdMid = parseFloat(_wizardDraft.perfThresholdMid) || 2.5;
  }

  if (_wizardDraft.dimData) {
    cfg.potentialDims = _wizardDraft.dimData.length ? _wizardDraft.dimData : cfg.potentialDims;
    cfg.potPointsPerYes = parseFloat(_wizardDraft.potPointsPerYes) || 1;
    cfg.potThresholdHigh = parseFloat(_wizardDraft.potThresholdHigh) || Math.round(calcPotMax(cfg) * 0.7);
    cfg.potThresholdMid = parseFloat(_wizardDraft.potThresholdMid) || Math.round(calcPotMax(cfg) * 0.4);
    cfg.riskQuestions = _wizardDraft.riskQuestions.length ? _wizardDraft.riskQuestions : DEFAULT_CONFIG.riskQuestions;
  }

  saveConfig(cfg);
  _wizardDraft = {};
  wizardClose();
  showToast('配置已保存！');
  navigate('settings-config');
}
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* CSV helpers */
function stripBOM(t) { return t.replace(/^\uFEFF/, ''); }
function parseCsvSimple(text) {
  text = stripBOM(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length < 2) return [];
  const headers = splitCsvLine(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitCsvLine(line);
    const obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i]||'').trim(); });
    return obj;
  });
}
function splitCsvLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}
function findCol(obj, keys) {
  const lk = Object.keys(obj).map(k=>k.toLowerCase());
  for (const k of keys) { const idx = lk.indexOf(k.toLowerCase()); if (idx >= 0) return Object.keys(obj)[idx]; }
  return null;
}

/* Import employee CSV */
function handleEmpCsvUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const rows = parseCsvSimple(evt.target.result);
      if (!rows.length) { document.getElementById('empCsvResult').innerHTML = '<span style="color:var(--danger);">CSV为空或格式错误</span>'; return; }
      const sample = rows[0];
     const cId = findCol(sample, ['工号','员工编号','id','empid','employee_id','员工工号']) || Object.keys(sample)[0];
     const cName = findCol(sample, ['姓名','名字','name','员工姓名']) || Object.keys(sample)[1];
      const cLvl = findCol(sample, ['层级','职级','级别','level']);
      const cDept = findCol(sample, ['部门','三级部门','department','dept','团队','组织']);
      const cPos = findCol(sample, ['职位','岗位','position','职务']);
      const cP1 = findCol(sample, ['2023绩效','绩效2023','perf2023','p2023','2023年绩效']);
      const cP2 = findCol(sample, ['2024绩效','绩效2024','perf2024','p2024','2024年绩效']);
      const cP3 = findCol(sample, ['2025绩效','绩效2025','perf2025','p2025','2025年绩效','绩效']);
      const cPwd = findCol(sample, ['密码','password','pwd']);
      const cMgrId = findCol(sample, ['直属上级工号','上级工号','评估人工号','managerid','直属主管工号']);
      const cMgrName = findCol(sample, ['直属上级','评估人','上级','manager','直属主管']);
      const cfg = getConfig();
      const teamCol = findCol(sample, [cfg.teamColumn, '三级部门', '部门', '团队']);
      
      const evMap = {}; // evaluator id/name -> {id,name,title,dept}
      const empList = [];
      rows.forEach(r => {
        const id = r[cId]; const name = r[cName]; if (!id || !name) return;
        const p1 = cP1 ? r[cP1] : ''; const p2 = cP2 ? r[cP2] : ''; const p3 = cP3 ? r[cP3] : '';
        const perfScore = calcPerfScore(p1, p2, p3);
        const perfLevel = calcPerfLevel(p1, p2, p3);
        const mgrId = cMgrId ? r[cMgrId] : ''; const mgrName = cMgrName ? r[cMgrName] : '';
        empList.push({
          id, name, level: cLvl?r[cLvl]:'', dept: cDept?r[cDept]:'',
          position: cPos?r[cPos]:'', perf2023:p1, perf2024:p2, perf2025:p3,
          perfScore, perfLevel, mgrId, mgrName,
          team: teamCol?r[teamCol]:''
        });
        if (mgrId || mgrName) {
          const ek = mgrId || mgrName;
          if (!evMap[ek]) evMap[ek] = { id: mgrId || ('mgr_'+mgrName), name: mgrName || mgrId, title:'', dept: cDept?r[cDept]:'' };
        }
      });
     employees = empList;
      // Merge auto-generated evaluators with existing ones (don't overwrite previously imported data)
      Object.values(evMap).forEach(function(ev) {
        var existing = eltList.find(function(e) { return e.id === ev.id; });
        if (!existing) {
          eltList.push(ev);
        } else {
          if (!existing.dept && ev.dept) existing.dept = ev.dept;
        }
      });
      // build reporting map
      reportingMap = {};
      const pwdMap = {};
      eltList.forEach(ev => { reportingMap[ev.id] = []; });
      empList.forEach(emp => {
        if (emp.mgrId && reportingMap[emp.mgrId] !== undefined) reportingMap[emp.mgrId].push(emp.id);
        else if (emp.mgrName) {
          const ev = eltList.find(e => e.name === emp.mgrName);
          if (ev) { reportingMap[ev.id].push(emp.id); emp.mgrId = ev.id; }
        }
      });
      // passwords
      if (cPwd) { rows.forEach(r => { if (r[cId] && r[cPwd]) pwdMap[r[cId]] = String(r[cPwd]).trim(); }); }
      // assign default passwords to evaluators if not in data
      eltList.forEach((ev,i) => { evaluatorPasswords[ev.id] = pwdMap[ev.id] || String(1000 + i).slice(-4); });
      // also carry employee passwords for evaluator-mode login
      Object.assign(evaluatorPasswords, pwdMap);
      saveAllData();
      logOp('导入员工数据: '+empList.length+'人, '+eltList.length+'名评估人');
      document.getElementById('empCsvResult').innerHTML = '<span style="color:var(--success);">✅ 导入成功：'+empList.length+'名被评估人，'+eltList.length+'名评估人。密码已自动生成。</span>';
      renderSidebar();
    } catch(err) {
      document.getElementById('empCsvResult').innerHTML = '<span style="color:var(--danger);">导入失败: '+err.message+'</span>';
      console.error(err);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

/* Distribute HTML */
function distributeHtml() {
  if (employees.length === 0) { alert('请先导入员工数据'); return; }
  document.getElementById('distResult').innerHTML = '<span style="color:var(--text-light);">⏳ 正在生成...</span>';
  setTimeout(() => {
    const dataJson = { config: getConfig(), employees, eltList, reportingMap, evaluatorPasswords, distributedAt: new Date().toISOString() };
    let newHtml = document.documentElement.outerHTML;
    const re = /<script id="tr-embedded-data"[\s\S]*?<\/script>/;
    const sc = '<scr'+'ipt id="tr-embedded-data" type="application/json">\n'+JSON.stringify(dataJson,null,2)+'\n</scr'+'ipt>';
    if (re.test(newHtml)) newHtml = newHtml.replace(re, sc); else newHtml = newHtml.replace('</body>', '  '+sc+'\n</body>');
    // Reset to login state: hide appShell, show roleGate
    newHtml = newHtml.replace(/id="appShell"[^>]*class="([^"]*)"/, function(m, cls) { return m.replace(cls, cls.replace(/\bshow\b/g,'').trim()); });
    newHtml = newHtml.replace(/id="roleGate"[^>]*class="([^"]*)"/, function(m, cls) { return m.replace(cls, cls.replace(/\bhidden\b/g,'').trim()); });
    // Remove any inline style display on roleGate
    newHtml = newHtml.replace(/(<div[^>]*id="roleGate"[^>]*?)style="[^"]*"/, '$1');
    newHtml = newHtml.replace(/(<div[^>]*id="appShell"[^>]*?)style="[^"]*"/, '$1');
    const blob = new Blob([newHtml], {type:'text/html;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'talent_review_评估分发_'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.html';
    a.click();
    document.getElementById('distResult').innerHTML = '<span style="color:var(--success);">✅ 文件已下载。请通过邮件发送给各评估人。</span>';
    logOp('生成分发文件');
  }, 100);
}

/* Merge assessment CSVs */
function handleAssessCsvUpload(e) {
  const files = Array.from(e.target.files); if (!files.length) return;
  let loaded = 0; let allRows = [];
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(evt) {
      try { allRows = allRows.concat(parseCsvSimple(evt.target.result)); } catch(err) { console.error(err); }
      loaded++;
      if (loaded === files.length) {
        csvData = buildCsvData(allRows);
        initSuccessionData();
        document.getElementById('assessCsvResult').innerHTML = '<span style="color:var(--success);">✅ 已加载 '+csvData.length+' 条评估记录（来自'+files.length+'个文件）</span>';
        document.getElementById('mergeResult').innerHTML = '<div style="margin-top:16px;"><button class="btn btn-success btn-large" onclick="navigate(\'assess-grid\')">📊 查看九宫格 →</button></div>';
        logOp('回收评估CSV: '+csvData.length+'条');
        manualMoves = {};
        saveAllData();
      }
    };
    reader.readAsText(file, 'UTF-8');
  });
}
function buildCsvData(rows) {
  return rows.map(r => {
    const potTotal = parseInt(r['潜力分']||r['potTotal']||0)||0;
    const riskTotal = parseInt(r['离职风险(ELT)']||r['riskTotal']||0)||0;
    return {
      empId: r['工号']||r['empId']||'', empName: r['姓名']||r['empName']||'',
      empDept: r['部门']||r['empDept']||'', empPosition: r['职位']||r['empPosition']||'',
      perfScore: r['绩效分']||r['perfScore']||'--', perfLevel: r['绩效等级']||r['perfLevel']||'缺失',
      potTotal, riskTotal,
      succession1: r['接班岗位1']||r['succession1']||'', readiness1: r['准备度1']||r['readiness1']||'na',
      succession2: r['接班岗位2']||r['succession2']||'', readiness2: r['准备度2']||r['readiness2']||'na',
      succession3: r['接班岗位3']||r['succession3']||'', readiness3: r['准备度3']||r['readiness3']||'na',
      crossRegion: r['跨区域意愿']||r['crossRegion']||'', crossFunc: r['跨职能意愿']||r['crossFunc']||'',
      strengths: r['优势']||r['strengths']||'',
      gaps: r['待提升']||r['gaps']||'',
      devPlan: r['发展建议']||r['devPlan']||'',
      crossTeamNote: r['跨团队备注']||'',
      evaluatorName: r['评估人']||r['evaluatorName']||''
    };
  }).filter(d => d.empId);
}

/* HRBP CSV */
function handleHrbpCsvUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    const rows = parseCsvSimple(evt.target.result);
    hrbpData = rows.map(r => {
      const idCol = findCol(r, ['工号','empid','员工编号']);
      const scCol = findCol(r, ['风险分','score','hrbpScore','离职风险分']);
      return { empId: idCol?r[idCol]:'', score: scCol?parseInt(r[scCol])||0:0 };
    }).filter(d=>d.empId);
    document.getElementById('hrbpCsvResult').innerHTML = '<span style="color:var(--success);">✅ 已加载 '+hrbpData.length+' 条HRBP风险数据</span>';
    logOp('导入HRBP风险数据: '+hrbpData.length+'条');
  };
  reader.readAsText(file, 'UTF-8');
}
function getHrbpScore(empId) { const h = hrbpData.find(d=>d.empId===empId); return h ? h.score : 0; }
function getRiskLevel(eltScore, hrbpScore) {
  // Percentage-based thresholds: each risk question = 5 points (是=5, 否=0)
  // ELT and HRBP each answer the same questions, so max combined = questions * 10
  const cfg = getConfig();
  const maxPerSource = (cfg.riskQuestions.length || 8) * 5;
  const maxCombined = maxPerSource * 2;
  const combined = (eltScore || 0) + (hrbpScore || 0);
  const highT = Math.floor(maxCombined * 0.5);
  const midT = Math.floor(maxCombined * 0.25);
  if (combined >= highT) return { level:'高风险', cls:'risk-high' };
  if (combined >= midT) return { level:'中风险', cls:'risk-mid' };
  return { level:'低风险', cls:'risk-low' };
}

function importBackup(e) {

      csvData = d.csvData||[]; hrbpData = d.hrbpData||[]; successionData = d.successionData||{};

function downloadHrbpTemplate() {
  const cfg = getConfig();
  var qCount = cfg.riskQuestions.length;
  var maxPer = qCount * 5;
  var maxCombined = maxPer * 2;
  var highT = Math.floor(maxCombined * 0.5);
  var midT = Math.floor(maxCombined * 0.25);
  // Guidance sheet: scoring rules + risk questions
  var guide = 'HRBP离职风险评分引导\n\n';
  guide += '评分规则：每题回答"是"=5分，"否"=0分\n';
  guide += '题目数量：' + qCount + ' 题\n';
  guide += 'ELT评估人端满分：' + maxPer + ' 分\n';
  guide += 'HRBP端满分：' + maxPer + ' 分\n';
  guide += '综合满分（ELT+HRBP）：' + maxCombined + ' 分\n\n';
  guide += '风险等级判定标准：\n';
  guide += '高风险：综合分 >= ' + highT + ' 分（满分的50%取整）\n';
  guide += '中风险：' + midT + ' 分 <= 综合分 < ' + highT + ' 分（满分的25%-50%）\n';
  guide += '低风险：综合分 < ' + midT + ' 分（满分的25%以下）\n\n';
  guide += '说明：请在"数据录入"表中为每位被评估人填写HRBP端的风险总分（即下方各题回答"是"的题数 x 5），ELT评估人端分数由评估人在系统中填写后自动汇总。\n\n';
  guide += '序号,离职风险题目,评分标准\n';
  cfg.riskQuestions.forEach(function(q, i) {
    guide += (i+1) + ',"' + q.replace(/"/g, '""') + '",' + '是=5分 / 否=0分\n';
  });
  downloadCsv('HRBP离职风险评分引导.csv', guide);
  // Data entry sheet: employee list with score column
  setTimeout(function() {
    var rows = '工号,姓名,部门,风险分\n';
    if (employees.length) {
      employees.forEach(function(e) {
        rows += e.id + ',' + e.name + ',' + (e.dept||'') + ',\n';
      });
    } else {
      rows += 'M001,张三,销售一部,\n';
      rows += 'M002,李四,产品一部,\n';
    }
    downloadCsv('HRBP离职风险数据模板.csv', rows);
  }, 400);
}

function handleEvaluatorCsvUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const rows = parseCsvSimple(evt.target.result);
      if (!rows.length) { showToast('CSV为空或格式错误'); return; }
      const sample = rows[0];
      const cId = findCol(sample, ['工号','员工编号','id','empid','评估人工号']) || Object.keys(sample)[0];
      const cName = findCol(sample, ['姓名','名字','name','评估人姓名']) || Object.keys(sample)[1];
      const cTitle = findCol(sample, ['岗位','职位','position','职务','title']);
      const cDept = findCol(sample, ['部门','department','dept','组织']);
      const cLevel = findCol(sample, ['层级','职级','级别','level']);
      const cPwd = findCol(sample, ['密码','password','pwd']);
      let added=0, skipped=0;
      rows.forEach(r => {
        const id = r[cId], name = r[cName]; if (!id || !name) { skipped++; return; }
        const existing = eltList.find(ev=>ev.id===id);
        if (existing) {
          existing.name = name;
          if (cTitle) existing.title = r[cTitle];
          if (cDept) existing.dept = r[cDept];
          if (cLevel) existing.level = r[cLevel];
        } else {
          eltList.push({ id, name, title: cTitle?r[cTitle]:'', dept: cDept?r[cDept]:'', level: cLevel?r[cLevel]:'' });
          added++;
        }
        if (cPwd && r[cPwd]) evaluatorPasswords[id] = String(r[cPwd]).trim();
      });
      rebuildReportingMap();
      saveAllData(); logOp('导入评估人CSV: '+(added+rows.length-skipped)+'名');
      var evMsg = '✅ 导入完成：新增 '+added+' 名，更新 '+(rows.length-skipped-added)+' 名，跳过 '+skipped+' 行';
      var evDiv = document.getElementById('evImpResult');
      if (evDiv) { evDiv.innerHTML = '<span style="color:var(--success);">'+evMsg+'</span>'; renderSidebar(); }
      else { showToast(evMsg); renderSidebar(); navigate('base-evaluators'); }
    } catch(err) {
      showToast('导入失败: '+err.message);
    }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

/* inline CSV import on the people page */
function handleEmpCsvInline(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const rows = parseCsvSimple(evt.target.result);
      if (!rows.length) { showToast('CSV为空或格式错误'); return; }
      const sample = rows[0];
      const cId = findCol(sample, ['工号','员工编号','id','empid','employee_id','员工工号']) || Object.keys(sample)[0];
      const cName = findCol(sample, ['姓名','名字','name','员工姓名']) || Object.keys(sample)[1];
      const cLvl = findCol(sample, ['层级','职级','级别','level']);
      const cDept = findCol(sample, ['部门','三级部门','department','dept','团队','组织']);
      const cPos = findCol(sample, ['职位','岗位','position','职务']);
      const cP1 = findCol(sample, ['2023绩效','绩效2023','perf2023','p2023','2023年绩效']);
      const cP2 = findCol(sample, ['2024绩效','绩效2024','perf2024','p2024','2024年绩效']);
      const cP3 = findCol(sample, ['2025绩效','绩效2025','perf2025','p2025','2025年绩效','绩效']);
      const cMgrId = findCol(sample, ['直属上级工号','上级工号','评估人工号','managerid','直属主管工号']);
      const cMgrName = findCol(sample, ['直属上级','评估人','上级','manager','直属主管']);
      const cfg = getConfig();
      const teamCol = findCol(sample, [cfg.teamColumn, '三级部门', '部门', '团队']);
      const empList = [];
      rows.forEach(r => {
        const id = r[cId]; const name = r[cName]; if (!id || !name) return;
        const p1 = cP1 ? r[cP1] : ''; const p2 = cP2 ? r[cP2] : ''; const p3 = cP3 ? r[cP3] : '';
        const mgrId = cMgrId ? r[cMgrId] : ''; const mgrName = cMgrName ? r[cMgrName] : '';
        empList.push({
          id, name, level: cLvl?r[cLvl]:'', dept: cDept?r[cDept]:'',
          position: cPos?r[cPos]:'', perf2023:p1, perf2024:p2, perf2025:p3,
          perfScore: calcPerfScore(p1, p2, p3), perfLevel: calcPerfLevel(p1, p2, p3),
          mgrId, mgrName, team: teamCol?r[teamCol]:''
        });
      });
      employees = empList;
      rebuildReportingMap();
      saveAllData(); logOp('导入员工数据: '+empList.length+'人');
      showToast('✅ 导入成功：'+empList.length+' 名被评估人员');
      renderSidebar(); navigate('base-people');
    } catch(err) { showToast('导入失败: '+err.message); }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}
function rebuildReportingMap() {
  reportingMap = {};
  eltList.forEach(ev => { reportingMap[ev.id] = []; });
  employees.forEach(emp => {
    if (emp.mgrId && reportingMap[emp.mgrId] !== undefined) {
      reportingMap[emp.mgrId].push(emp.id);
    } else if (emp.mgrName) {
      const ev = eltList.find(e => e.name === emp.mgrName);
      if (ev) { reportingMap[ev.id].push(emp.id); emp.mgrId = ev.id; }
    }
  });
}

/* auto-match: given a person name or position name, find in evaluators + employees */
function matchPositionHolder(query, posName) {
  if (!query) return null;
  // first try exact name match
  const ev = eltList.find(e => e.name === query);
  if (ev) return { name: ev.name, dept: ev.dept||'', level: ev.level||'', type: '评估人', id: ev.id };
  const emp = employees.find(e => e.name === query);
  if (emp) return { name: emp.name, dept: emp.dept||'', level: emp.level||'', type: '被评估人', id: emp.id };
  // then try position/title match
  const evByTitle = eltList.find(e => e.title && e.title.includes(posName||query));
  if (evByTitle) return { name: evByTitle.name, dept: evByTitle.dept||'', level: evByTitle.level||'', type: '评估人', id: evByTitle.id };
  const empByPos = employees.find(e => e.position && e.position.includes(posName||query));
  if (empByPos) return { name: empByPos.name, dept: empByPos.dept||'', level: empByPos.level||'', type: '被评估人', id: empByPos.id };
  return null;
}
/* live search for position editor */
function searchPositionHolders() {
  const q = val('posName').trim().toLowerCase();
  const holderQ = val('posHolder').trim().toLowerCase();
  const div = document.getElementById('posMatchResult'); if (!div) return;
  if (!q && !holderQ) { div.innerHTML = ''; return; }
  const matches = [];
  eltList.forEach(ev => {
    const title = (ev.title||'').toLowerCase();
    if ((q && title.includes(q)) || (holderQ && ev.name.toLowerCase().includes(holderQ))) {
      matches.push({ name: ev.name, dept: ev.dept||'', level: ev.level||'', type: '评估人' });
    }
  });
  employees.forEach(emp => {
    const pos = (emp.position||'').toLowerCase();
    if ((q && pos.includes(q)) || (holderQ && emp.name.toLowerCase().includes(holderQ))) {
      if (!matches.find(m => m.name === emp.name)) {
        matches.push({ name: emp.name, dept: emp.dept||'', level: emp.level||'', type: '被评估人' });
      }
    }
  });
  if (!matches.length) { div.innerHTML = '<div style="font-size:12px;color:var(--text-light);padding:6px 0;">未找到匹配人员</div>'; return; }
  div.innerHTML = '<div style="font-size:12px;color:var(--text-light);padding:6px 0;">找到 '+matches.length+' 名匹配人员，点击可自动填充：</div>' +

}

function savePosition(idx) {
  const name = val('posName').trim();
  if (!name) { showToast('岗位名称为必填项'); return; }

  const matched = holder ? matchPositionHolder(holder, name) : null;
  const rec = {
    name, dept: val('posDept'),
    holder,
    holderDept: matched ? matched.dept : '',
    holderLevel: matched ? matched.level : '',
    source: idx >= 0 && keyPositions[idx] ? keyPositions[idx].source : 'manual'
  };
  if (idx >= 0) { keyPositions[idx] = rec; }
  else { keyPositions.push(rec); }

function handlePositionCsvUpload(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const rows = parseCsvSimple(evt.target.result);
      if (!rows.length) { showToast('CSV为空或格式错误'); return; }
      const sample = rows[0];
      const cName = findCol(sample, ['岗位名称','职位名称','岗位','position','title']) || Object.keys(sample)[0];
      const cDept = findCol(sample, ['所属部门','部门','department','dept']);
      const cHolder = findCol(sample, ['现任负责人','负责人','holder','现任']);
      const cLevel = findCol(sample, ['层级','职级','级别','level']);
      let added = 0;
      rows.forEach(r => {
        const name = r[cName]; if (!name) return;
        const holder = cHolder ? r[cHolder] : '';
        const matched = holder ? matchPositionHolder(holder, name) : null;
        if (!keyPositions.find(p => p.name === name)) {
          keyPositions.push({
            name, dept: cDept?r[cDept]:'',
            holder,
            holderDept: matched ? matched.dept : (cDept?r[cDept]:''),
            holderLevel: matched ? matched.level : (cLevel?r[cLevel]:''),
            source: 'import'
          });
          added++;
        }
      });
      saveAllData(); logOp('导入岗位CSV: '+added+'个');
      var kpMsg = '✅ 导入完成：新增 '+added+' 个岗位';
      var kpDiv = document.getElementById('kpImpResult');
      if (kpDiv) { kpDiv.innerHTML = '<span style="color:var(--success);">'+kpMsg+'</span>'; renderSidebar(); }
      else { showToast(kpMsg); navigate('base-positions'); }
    } catch(err) { showToast('导入失败: '+err.message); }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

function setPot(key, val) { potAnswers[key] = val; renderAssessForm(); }
function setRisk(i, val) { riskAnswers[i] = val; renderAssessForm(); }
function setCross(f, val) { crossAnswers[f] = val; renderAssessForm(); }
function addSuccBlock() { successionBlocks.push({eltId:'', readiness:'na'}); renderSuccBlocks(); }
function renderSuccBlocks() {
  const cfg = getConfig();
  // Build position options from both key positions and evaluator titles
  const posItems = [];
  keyPositions.forEach(p => { posItems.push({id:'pos_'+p.name, label:p.name+(p.holder?(' · '+p.holder):'')}); });
  eltList.forEach(e => { posItems.push({id:'elt_'+e.id, label:e.name+' - '+(e.title||e.dept||'')}); });
  const posOpts = posItems.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.label)+'</option>').join('');

      '<select class="input succ-elt" style="flex:2;" onchange="updateSuccBlock('+i+',\'eltId\',this.value)"><option value="">选择岗位</option>'+posOpts+'</select>'+

      '<option value="now"'+(b.readiness==='now'?' selected':'')+'>Ready Now</option>'+
      '<option value="1-3"'+(b.readiness==='1-3'?' selected':'')+'>1-3年</option>'+
      '<option value="3+"'+(b.readiness==='3+'?' selected':'')+'>3年+</option></select>'+
      (i>0?'<button class="btn btn-sm btn-danger" onclick="successionBlocks.splice('+i+',1);renderSuccBlocks();">✕</button>':'')+
      '</div>';

function updateSuccBlock(i, field, val) { if (successionBlocks[i]) successionBlocks[i][field] = val; }
function updateAssessResults() {
  const cfg = getConfig(); const dims = cfg.potentialDims;
  let potTotal = 0;
  const ppy = cfg.potPointsPerYes || 1;
  dims.forEach((dim, di) => { let yc = 0; dim.questions.forEach((_, qi) => { if (potAnswers[di+'_'+qi]===true) yc++; }); potTotal += yc * ppy; });
  let riskTotal = 0; for (let i = 0; i < cfg.riskQuestions.length; i++) { if (riskAnswers[i]===true) riskTotal += 5; }
  const pb = document.getElementById('potBadge'); if (pb) pb.textContent = potTotal+' / '+calcPotMax(cfg);
  const rb = document.getElementById('riskBadge'); if (rb) rb.textContent = riskTotal+' / '+(cfg.riskQuestions.length*5);
}
function resetAssessForm() {
  if (!confirm('确定重置当前评估表单？')) return;
  potAnswers = {}; riskAnswers = {}; crossAnswers = {region:null,family:null,func:null,mgmt:null};
  successionBlocks = [{eltId:'', readiness:'na'}]; renderAssessForm();
}
function saveAssessmentResult() {
  if (!currentEmp || !currentEvaluator) { alert('请先选择被评估人'); return; }
  const cfg = getConfig(); const dims = cfg.potentialDims;
  let potTotal = 0;
  const ppy = cfg.potPointsPerYes || 1;
  dims.forEach((dim, di) => { let yc = 0; dim.questions.forEach((_, qi) => { if (potAnswers[di+'_'+qi]===true) yc++; }); potTotal += yc * ppy; });
  let riskTotal = 0; for (let i = 0; i < cfg.riskQuestions.length; i++) { if (riskAnswers[i]===true) riskTotal += 5; }
  const data = {
    empId: currentEmp.id, empName: currentEmp.name, empDept: currentEmp.dept, empPosition: currentEmp.position,
    perfScore: currentEmp.perfScore, perfLevel: currentEmp.perfLevel,
    evaluatorId: currentEvaluator.id, evaluatorName: currentEvaluator.name,
    potAnswers: {...potAnswers}, riskAnswers: {...riskAnswers}, crossAnswers: {...crossAnswers},
    crossTeamNote: (document.getElementById('crossNote')||{}).value||'',
    strengths: (document.getElementById('assStrengths')||{}).value||'', gaps: (document.getElementById('assGaps')||{}).value||'',
    devPlan: (document.getElementById('assDevPlan')||{}).value||'',
    succession: successionBlocks.map(b=>({...b})),
    potTotal, riskTotal, savedAt: new Date().toISOString()
  };
  const idx = savedAssessments.findIndex(a => a.empId===currentEmp.id && a.evaluatorId===currentEvaluator.id);
  if (idx >= 0) savedAssessments[idx] = data; else savedAssessments.push(data);
  saveAssessments(); showToast('评估已保存！'); logOp('保存评估: '+currentEmp.name);
  renderSidebar();
}
function exportMyResult() {
  if (savedAssessments.length === 0) { alert('暂无已保存的评估数据'); return; }
  const myData = currentRole === 'evaluator' ? savedAssessments.filter(a => a.evaluatorId === currentEvaluator.id) : savedAssessments;
  const headers = ['工号','姓名','部门','职位','绩效分','绩效等级','潜力分','离职风险(ELT)','接班岗位1','准备度1','接班岗位2','准备度2','接班岗位3','准备度3','跨区域意愿','跨职能意愿','优势','待提升','发展建议','跨团队备注','评估人','保存时间'];
  const rows = myData.map(a => {
    const s = a.succession || []; const getElt = id => { const e = eltList.find(x=>x.id===id); return e?e.name:''; };
    return [a.empId, a.empName, a.empDept, a.empPosition, a.perfScore||'', a.perfLevel||'', a.potTotal||'', a.riskTotal||'',
      getElt(s[0]?.eltId), s[0]?.readiness||'na', getElt(s[1]?.eltId), s[1]?.readiness||'', getElt(s[2]?.eltId), s[2]?.readiness||'',
      a.crossAnswers?.region===true?'愿意':(a.crossAnswers?.region===false?'不愿意':'不确定'),
      a.crossAnswers?.func===true?'愿意':(a.crossAnswers?.func===false?'不愿意':'不确定'),
      a.strengths||'', a.gaps||'', a.devPlan||'', a.crossTeamNote||'',
      a.evaluatorName||'', a.savedAt?a.savedAt.slice(0,10):''];
  });
  const csv = [headers.join(','), ...rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '团队评估汇总_'+(currentEvaluator?currentEvaluator.name:'')+'_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  logOp('导出评估CSV: '+rows.length+'条');
}

/* ===== ASSESS: Nine Grid ===== */
function getMatrixKey(perfLevel, potTotal) {
  const cfg = getConfig();
  const pot = potTotal >= cfg.potThresholdHigh ? 'high' : (potTotal >= cfg.potThresholdMid ? 'mid' : 'low');
  const perf = perfLevel === '高' ? 'high' : (perfLevel === '中' ? 'mid' : 'low');
  return pot + '_' + perf;
}
function getMatrixLabel(key) {
  const labels = {'high_high':'⭐ 星星人才','high_mid':'💡 潜力之星','high_low':'⚠️ 关注对象','mid_high':'🔧 核心人才','mid_mid':'📦 基石人才','mid_low':'📉 基础人才','low_high':'📉 基础人才','low_mid':'📉 基础人才','low_low':'📉 基础人才'};
  return labels[key] || '—';
}
function getMatrixCellClass(key) {
  const map = {'high_high':'star','high_mid':'hipo','mid_high':'core','mid_mid':'solid'};
  return map[key] || 'basic';
}

/* Shared grid builder: X=potential (low→high), Y=performance (high→low top→bottom) */
function buildGridData() {
  const gd = {};
  ['high_high','high_mid','high_low','mid_high','mid_mid','mid_low','low_high','low_mid','low_low'].forEach(k => gd[k] = []);
  csvData.forEach(d => {
    let key = manualMoves[d.empId] ? (manualMoves[d.empId].pot+'_'+manualMoves[d.empId].perf) : getMatrixKey(d.perfLevel, d.potTotal);
    if (gd[key]) gd[key].push(d);
  });
  return gd;
}
function buildNineGridHtml(allowDrag) {
  const gd = buildGridData();
  let h = '<div class="matrix-big" id="nineGrid">';
  // header: potential axis (low→high left→right)
  h += '<div class="m-corner"></div><div class="m-label">低潜力</div><div class="m-label">中潜力</div><div class="m-label">高潜力</div>';
  // rows: performance (high→low top→bottom)
  [['high','高绩效'],['mid','中绩效'],['low','低绩效']].forEach(function(row){
    var perf = row[0], lbl = row[1];
    h += '<div class="m-label" style="align-items:flex-end;">'+lbl+'</div>';
    ['low','mid','high'].forEach(function(pot){
      var key = pot+'_'+perf;
      var items = gd[key]||[];
      var cls = getMatrixCellClass(key);
      h += '<div class="m-cell '+cls+'" data-key="'+key+'"'+(allowDrag?' ondragover="event.preventDefault();this.classList.add(\'drag-over\')" ondragleave="this.classList.remove(\'drag-over\')" ondrop="gridDrop(event)"':'')+'>';
      h += '<div class="cell-title">'+getMatrixLabel(key)+(items.length?' ('+items.length+')':'')+'</div><div class="names">';
      items.forEach(function(d){
        var moved = manualMoves[d.empId]?' moved':'';
        h += '<span class="name-tag'+moved+'"'+(allowDrag?' draggable="true" ondragstart="gridDragStart(event,\''+d.empId+'\')" ondragend="this.parentElement.parentElement.classList.remove(\'drag-over\')"':'')+' onclick="showEmpDetail(\''+d.empId+'\')" title="'+esc(d.empName)+' · '+esc(d.empPosition||'')+'">'+esc(d.empName)+'</span>';
      });
      h += '</div></div>';
    });
  });
  h += '</div>';
  return h;
}

let _dragEmpId = null;
function gridDragStart(e, empId) { _dragEmpId = empId; e.dataTransfer.effectAllowed = 'move'; }
function gridDrop(e) {
  e.preventDefault();
  document.querySelectorAll('.m-cell.drag-over').forEach(c => c.classList.remove('drag-over'));
  const cell = e.currentTarget;
  const key = cell.dataset.key;
  if (!_dragEmpId || !key) return;
  var parts = key.split('_');
  var pot = parts[0], perf = parts[1];
  manualMoves[_dragEmpId] = { pot, perf };
  saveAllData(); logOp('校准调整: '+_dragEmpId+' -> '+getMatrixLabel(key));
  _dragEmpId = null;
  if (currentView === 'assess-calibration') calibShowGrid();
  else navigate('assess-grid');
}
function clearManualMoves() {
  if (!confirm('确定清除所有校准调整？')) return;
  manualMoves = {}; saveAllData(); logOp('清除校准调整');
  if (currentView === 'assess-calibration') calibShowGrid();
  else navigate('assess-grid');
}

/* ===== ASSESS: Succession Plan ===== */
function initSuccessionData() {
  successionData = {};
  // Initialize from keyPositions (keyed by position name)
  keyPositions.forEach(kp => { successionData[kp.name] = { 'now':[], '1-3':[], '3+':[] }; });
  csvData.forEach(d => {
    for (let si = 1; si <= 3; si++) {
      const sName = d['succession'+si]; const ready = d['readiness'+si];
      if (ready && ready !== 'na' && sName) {
        // sName is a position name (e.g. "区域销售经理"), not a person name
        if (!successionData[sName]) successionData[sName] = { 'now':[], '1-3':[], '3+':[] };
        if (successionData[sName][ready]) {
          if (!successionData[sName][ready].find(c => c.empId === d.empId))
            successionData[sName][ready].push({ empId: d.empId, empName: d.empName, source: 'auto' });
        }
      }
    }
  });
}
VIEW_RENDERERS['assess-succession'] = function() {
  setTopbarRight('');
  if (!csvData.length) { document.getElementById('contentArea').innerHTML = noDataHtml('继任计划'); return; }
  // Build position list: keyPositions first, then any positions found in csvData not in keyPositions
  var posNames = [];
  keyPositions.forEach(kp => { if (posNames.indexOf(kp.name) < 0) posNames.push(kp.name); });
  csvData.forEach(d => {
    for (var si = 1; si <= 3; si++) {
      var sn = d['succession'+si];
      if (sn && posNames.indexOf(sn) < 0) posNames.push(sn);
    }
  });
  if (!posNames.length) {
    document.getElementById('contentArea').innerHTML = '<div class="empty-state"><div class="es-icon">👑</div><div class="es-title">暂无继任数据</div><div class="es-desc">评估结果中未包含接班岗位信息，或尚未回收评估数据。</div></div>';
    return;
  }
  let html = '<div class="panel"><div class="panel-header"><span>👑 关键岗位接班人地图</span><span style="font-size:12px;color:var(--text-light);">可搜索添加/删除候选人</span></div><div class="panel-body" style="overflow-x:auto;">';
  posNames.forEach(posName => {
    var kp = keyPositions.find(k => k.name === posName);
    var holderName = kp ? (kp.holder || '') : '';
    var kpDept = kp ? (kp.dept || '') : '';
    html += '<div style="display:inline-block;vertical-align:top;min-width:200px;max-width:240px;margin:0 12px 20px 0;">';
    html += '<div style="background:var(--navy);color:#fff;padding:10px 14px;border-radius:5px;font-size:13px;font-weight:600;text-align:center;">'+esc(posName)+(holderName?'<div style="font-size:10px;opacity:.8;font-weight:400;">现任：'+esc(holderName)+(kpDept?' · '+esc(kpDept):'')+'</div>':'')+'</div>';
    [['now','Ready Now'],['1-3','1-3年'],['3+','3年以上']].forEach(([key, title]) => {
      const list = (successionData[posName] && successionData[posName][key]) || [];
      html += '<div class="readiness-row"><div class="r-title">'+title+'</div><div class="r-names">';
      list.forEach(c => {
        html += '<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:3px;margin:2px;font-size:11px;background:#F0F9FF;color:var(--navy);border:1px solid #BAE6FD;">'+esc(c.empName)+' <span onclick="removeCandidate(\''+esc(posName).replace(/'/g,"\\'")+'\',\''+key+'\',\''+c.empId+'\')" style="cursor:pointer;color:var(--danger);font-weight:bold;">×</span></span>';
      });
      html += '<div style="margin-top:4px;"><input class="input" style="font-size:10px;padding:3px 6px;" placeholder="+ 搜索添加" oninput="filterSucc(this,\''+esc(posName).replace(/'/g,"\\'")+'\',\''+key+'\')"></div>';
      html += '</div></div>';
    });
    html += '</div>';
  });
  html += '</div></div>';
  document.getElementById('contentArea').innerHTML = html;
}
function removeCandidate(posName, ready, empId) {
  if (successionData[posName] && successionData[posName][ready])
    successionData[posName][ready] = successionData[posName][ready].filter(c => c.empId !== empId);
  saveAllData(); navigate('assess-succession');
}
function filterSucc(input, posName, ready) {
  const q = input.value.trim().toLowerCase();
  if (!q) return;
 // simple: on Enter add if exact match
  input.onkeydown = function(e) {
    if (e.key === 'Enter') {
      const matches = csvData.filter(d => d.empName.toLowerCase().includes(q) || d.empId.toLowerCase().includes(q));
      if (matches.length === 1) {
        if (successionData[posName] && successionData[posName][ready]) {
          if (!successionData[posName][ready].find(c => c.empId === matches[0].empId)) {
            successionData[posName][ready].push({ empId: matches[0].empId, empName: matches[0].empName, source: 'manual' });
            saveAllData(); navigate('assess-succession');
          }
        }
      }
    }
  };
}

VIEW_RENDERERS['assess-calibration'] = function() {
  setTopbarRight('<button class="btn btn-accent" onclick="exportCalibratedReport()">📋 导出校准后报告</button>');

  document.getElementById('contentArea').innerHTML =
    '<div class="tab-bar"><button class="tab active" onclick="calibTab(\'grid\',this)">⊞ 九宫格</button><button class="tab" onclick="calibTab(\'succ\',this)">👑 继任计划</button><button class="tab" onclick="calibTab(\'idp\',this)">🌱 IDP</button><button class="tab" onclick="calibTab(\'risk\',this)">⚠️ 风险(参考)</button><button class="tab" onclick="calibTab(\'cross\',this)">🔄 跨区意愿(参考)</button></div>' +
    '<div id="calibContent"></div>';

function calibTab(tab, btn) {
  document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  if (tab === 'grid') calibShowGrid();
  else if (tab === 'succ') calibShowSucc();
  else if (tab === 'idp') calibShowIdp();
  else if (tab === 'risk') calibShowRisk();
  else calibShowCross();
}

function calibShowIdp() {
  var cfg = getConfig();
  var isTalent = function(d){ return (d.perfLevel==='\u9ad8'&&d.potTotal>=cfg.potThresholdHigh)||(d.perfLevel==='\u4e2d'&&d.potTotal>=cfg.potThresholdHigh)||(d.perfLevel==='\u9ad8'&&d.potTotal>=cfg.potThresholdMid&&d.potTotal<cfg.potThresholdHigh); };
  var list = csvData.filter(function(d){ return isTalent(d); });
  var html = '<div class="panel"><div class="panel-header"><span>🌱 高潜人才发展计划</span><span style="font-size:12px;color:var(--text-light);">'+list.length+' 人</span></div><div class="panel-body">';
  if(!list.length){ html += '<div class="empty-state"><div class="es-icon">🌱</div><div class="es-title">暂无高潜人才</div></div></div></div>'; document.getElementById('calibContent').innerHTML = html; return; }
  html += '<table class="data-table"><thead><tr><th>姓名</th><th>定位</th><th>潜力</th><th>发展建议摘要</th><th>优势/待提升</th></tr></thead><tbody>';
  list.forEach(function(d){
    var key = manualMoves[d.empId]?(manualMoves[d.empId].pot+'_'+manualMoves[d.empId].perf):getMatrixKey(d.perfLevel,d.potTotal);

  });
  html += '</tbody></table></div></div>';
  document.getElementById('calibContent').innerHTML = html;
}
function calibShowRisk() {
  const cfg = getConfig();
  const riskList = csvData.map(d => {
    const hrbpScore = getHrbpScore(d.empId);
    const combined = d.riskTotal + hrbpScore;
    const risk = getRiskLevel(d.riskTotal, hrbpScore);
    return { ...d, hrbpScore, combined, riskLevel: risk.level, riskCls: risk.cls };
  }).filter(d => d.riskLevel !== '低风险').sort((a,b) => b.combined - a.combined);
  let html = '<div class="panel"><div class="panel-header"><span>⚠️ 离职风险清单（中/高风险）</span></div><div class="panel-body">';
  if (!riskList.length) html += '<div class="empty-state"><div class="es-icon">✅</div><div class="es-title">暂无中/高风险人员</div></div>';
  else {
    html += '<table class="data-table"><thead><tr><th>姓名</th><th>职位</th><th>部门</th><th>ELT风险分</th><th>HRBP风险分</th><th>综合分</th><th>风险等级</th></tr></thead><tbody>';
    riskList.forEach(d => {
      html += '<tr><td style="font-weight:500;">'+esc(d.empName)+'</td><td>'+esc(d.empPosition||'')+'</td><td>'+esc(d.empDept||'')+'</td><td>'+d.riskTotal+'</td><td>'+d.hrbpScore+'</td><td style="font-weight:600;">'+d.combined+'</td><td><span class="risk-indicator '+d.riskCls+'">'+d.riskLevel+'</span></td></tr>';

  html += '</div></div>';
  document.getElementById('calibContent').innerHTML = html;
}

    h+='<table><tr><th>\u59D3\u540D</th><th>\u5B9A\u4F4D</th><th>\u6F5C\u529B</th><th>\u4F18\u52BF</th><th>\u5F85\u63D0\u5347</th><th>\u53D1\u5C55\u5EFA\u8BAE</th></tr>';
    idpList.forEach(function(d){
      var key=manualMoves[d.empId]?(manualMoves[d.empId].pot+'_'+manualMoves[d.empId].perf):getMatrixKey(d.perfLevel,d.potTotal);

    });
    h+='</table></div>';
  }
  // Risk list
  var riskList=csvData.map(function(d){var hs=getHrbpScore(d.empId);var r=getRiskLevel(d.riskTotal,hs);return Object.assign({},d,{combined:d.riskTotal+hs,riskLevel:r.level,riskCls:r.cls});}).filter(function(d){return d.riskLevel!=='\u4F4E\u98CE\u9669';}).sort(function(a,b){return b.combined-a.combined;});
  if(riskList.length){
    h+='<div class="section"><h2>\u26A0\uFE0F \u79BB\u804C\u98CE\u9669\u6E05\u5355\uFF08\u4E2D/\u9AD8\u98CE\u9669\uFF09</h2><table><tr><th>\u59D3\u540D</th><th>\u804C\u4F4D</th><th>ELT\u98CE\u9669</th><th>HRBP\u98CE\u9669</th><th>\u7EFC\u5408\u5206</th><th>\u7B49\u7EA7</th></tr>';
    riskList.forEach(function(d){h+='<tr><td style="font-weight:500;">'+esc(d.empName)+'</td><td>'+esc(d.empPosition||'')+'</td><td>'+d.riskTotal+'</td><td>'+getHrbpScore(d.empId)+'</td><td style="font-weight:600;">'+d.combined+'</td><td>'+d.riskLevel+'</td></tr>';});
    h+='</table></div>';
  }

  var crossList=csvData.filter(function(d){return d.crossRegion==='\u613F\u610F'||d.crossFunc==='\u613F\u610F';});
  if(crossList.length){
    h+='<div class="section"><h2>\u{1F504} \u8DE8\u56E2\u961F\u6D41\u52A8\u610F\u613F\uFF08\u53C2\u8003\uFF09</h2><table><tr><th>\u59D3\u540D</th><th>\u804C\u4F4D</th><th>\u8DE8\u533A\u57DF</th><th>\u8DE8\u804C\u80FD</th><th>\u4E5D\u5BAB\u683C\u5B9A\u4F4D</th><th>\u8DE8\u56E2\u961F\u5907\u6CE8</th></tr>';
    crossList.forEach(function(d){
      var key=manualMoves[d.empId]?(manualMoves[d.empId].pot+'_'+manualMoves[d.empId].perf):getMatrixKey(d.perfLevel,d.potTotal);

    });
    h+='</table></div>';
  }
  h+='<div style="text-align:center;color:#9CA3AF;font-size:11px;padding:20px;">\u672C\u62A5\u544A\u7531\u4EBA\u624D\u76D8\u70B9\u5E73\u53F0\u81EA\u52A8\u751F\u6210 \u00B7 '+dateStr+'</div>';
  h+='</body></html>';
  var blob=new Blob([h],{type:'text/html;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='TalentReview_\u6821\u51C6\u540E\u62A5\u544A_'+dateStr.replace(/\//g,'')+'.html';a.click();
  logOp('\u5BFC\u51FA\u6821\u51C6\u540E\u62A5\u544A');showToast('\u6821\u51C6\u540E\u62A5\u544A\u5DF2\u4E0B\u8F7D\uFF01');
}

VIEW_RENDERERS['assess-batch'] = function() {
  setTopbarRight('<button class="btn btn-primary" onclick="saveBatchRecord()">💾 保存当前快照</button>');
