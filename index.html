  if (!csvData.length && !batchRecords.length) {
    html += '<div class="empty-state"><div class="es-icon">📊</div><div class="es-title">暂无批次记录</div><div class="es-desc">回收评估CSV后，点击右上角「保存当前快照」记录本次盘点结果</div></div>';
  } else {
    if (csvData.length) {
      html += '<div class="hint-box">当前有 <strong>'+csvData.length+'</strong> 条评估数据可保存为快照。保存后可随时回看历史盘点分布。</div>';
    }
    if (batchRecords.length) {
      html += '<table class="data-table" style="margin-top:16px;"><thead><tr><th>批次名称</th><th>保存时间</th><th>人数</th><th>⭐星星</th><th>💡潜力</th><th>🔧核心</th><th>高风险</th><th>操作</th></tr></thead><tbody>';
      batchRecords.forEach((b, i) => {
        html += '<tr><td style="font-weight:500;">'+esc(b.name)+'</td><td style="font-size:11px;">'+esc(b.savedAt||'')+'</td><td>'+b.total+'</td><td style="color:var(--success);">'+b.stars+'</td><td style="color:#1E40AF;">'+b.hipos+'</td><td style="color:var(--warning);">'+b.cores+'</td><td style="color:var(--danger);">'+b.highRisk+'</td><td><button class="btn btn-sm btn-ghost" onclick="viewBatch('+i+')">查看</button> <button class="btn btn-sm btn-danger" onclick="delBatch('+i+')">删除</button></td></tr>';
      });
      html += '</tbody></table>';
    }
  }
  html += '</div></div>';
  document.getElementById('contentArea').innerHTML = html;
};
function saveBatchRecord() {
  if (!csvData.length) { alert('暂无评估数据可保存'); return; }
  const cfg = getConfig();
  const gridData = {};
  ['high_high','high_mid','high_low','mid_high','mid_mid','mid_low','low_high','low_mid','low_low'].forEach(k => gridData[k] = []);
  csvData.forEach(d => { let key = manualMoves[d.empId]?(manualMoves[d.empId].pot+'_'+manualMoves[d.empId].perf):getMatrixKey(d.perfLevel,d.potTotal); if(gridData[key]) gridData[key].push(d); });
  const stars = (gridData['high_high']||[]).length, hipos = (gridData['high_mid']||[]).length, cores = (gridData['mid_high']||[]).length;
  const highRisk = csvData.filter(d => { const r = getRiskLevel(d.riskTotal, getHrbpScore(d.empId)); return r.level === '高风险'; }).length;
  const name = (cfg.projectName||'盘点') + ' ' + new Date().toLocaleDateString('zh-CN');
  batchRecords.push({ name, savedAt: new Date().toLocaleString('zh-CN'), total: csvData.length, stars, hipos, cores, highRisk, snapshot: JSON.parse(JSON.stringify(csvData)), moves: JSON.parse(JSON.stringify(manualMoves)) });
  saveAllData(); logOp('保存盘点快照: '+name);
  showToast('快照已保存！');
  navigate('assess-batch');
}
function viewBatch(i) {
  const b = batchRecords[i]; if (!b) return;
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;margin-bottom:16px;">';
  html += '<div><span style="color:var(--text-light);">总人数</span><br><strong>'+b.total+'</strong></div>';
  html += '<div><span style="color:var(--text-light);">⭐星星人才</span><br><strong style="color:var(--success);">'+b.stars+'</strong></div>';
  html += '<div><span style="color:var(--text-light);">💡潜力之星</span><br><strong style="color:#1E40AF;">'+b.hipos+'</strong></div>';
  html += '<div><span style="color:var(--text-light);">🔧核心人才</span><br><strong style="color:var(--warning);">'+b.cores+'</strong></div>';
  html += '</div>';
  if (b.snapshot) {
    html += '<table class="data-table"><thead><tr><th>姓名</th><th>部门</th><th>绩效等级</th><th>潜力分</th><th>九宫格定位</th></tr></thead><tbody>';
    b.snapshot.forEach(d => {
      const key = (b.moves && b.moves[d.empId]) ? (b.moves[d.empId].pot+'_'+b.moves[d.empId].perf) : getMatrixKey(d.perfLevel, d.potTotal);
      html += '<tr><td>'+esc(d.empName)+'</td><td>'+esc(d.empDept||'')+'</td><td>'+(d.perfLevel||'缺失')+'</td><td>'+d.potTotal+'</td><td style="font-size:11px;">'+getMatrixLabel(key)+'</td></tr>';
    });
    html += '</tbody></table>';
  }
  const ov = document.getElementById('genericOverlay');
  document.getElementById('genericTitle').textContent = '📋 '+b.name;
  document.getElementById('genericBody').innerHTML = html;
  document.getElementById('genericFooter').innerHTML = '<button class="btn btn-ghost" onclick="closeGeneric()">关闭</button>';
  ov.classList.add('show');
}
function delBatch(i) { if (!confirm('确定删除此批次记录？')) return; batchRecords.splice(i,1); saveAllData(); navigate('assess-batch'); }

/* ===== ANALYSIS: Dashboard ===== */
VIEW_RENDERERS['analysis-dashboard'] = function() {
  setTopbarRight('');

  const cfg = getConfig();
  const total = csvData.length;

  const midPerf = csvData.filter(d=>d.perfLevel==='中').length;
  const lowPerf = csvData.filter(d=>d.perfLevel==='低').length;
  const highPot = csvData.filter(d=>d.potTotal>=cfg.potThresholdHigh).length;
  const stars = csvData.filter(d=>d.perfLevel==='高'&&d.potTotal>=cfg.potThresholdHigh).length;
  const hipos = csvData.filter(d=>d.perfLevel==='中'&&d.potTotal>=cfg.potThresholdHigh).length;
  const cores = csvData.filter(d=>d.perfLevel==='高'&&d.potTotal>=cfg.potThresholdMid&&d.potTotal<cfg.potThresholdHigh).length;
  const highRisk = csvData.filter(d=>{const r=getRiskLevel(d.riskTotal,getHrbpScore(d.empId));return r.level==='高风险';}).length;
  const midRisk = csvData.filter(d=>{const r=getRiskLevel(d.riskTotal,getHrbpScore(d.empId));return r.level==='中风险';}).length;

  let html = '<div class="stat-grid">';

  html += '<div class="stat-card"><div class="sc-num success">'+stars+'</div><div class="sc-label">⭐ 星星人才</div></div>';
  html += '<div class="stat-card"><div class="sc-num accent">'+(stars+hipos+cores)+'</div><div class="sc-label">高潜+核心人才</div></div>';
  html += '<div class="stat-card"><div class="sc-num danger">'+highRisk+'</div><div class="sc-label">高风险人员</div></div>';

  // talent distribution bar
  html += '<div class="panel"><div class="panel-header"><span>📊 人才分类分布</span></div><div class="panel-body">';
  const cats = [['⭐星星',stars,'#2D6A4F'],['💡潜力',hipos,'#1E40AF'],['🔧核心',cores,'#B85C14'],['📦基石',csvData.filter(d=>{const k=getMatrixKey(d.perfLevel,d.potTotal);return k==='mid_mid';}).length,'#6B7280'],['📉基础',total-stars-hipos-cores-csvData.filter(d=>{const k=getMatrixKey(d.perfLevel,d.potTotal);return k==='mid_mid';}).length,'#9B2335']];
  cats.forEach(([label, count, color]) => {

    html += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;"><div style="width:70px;font-size:12px;font-weight:500;">'+label+'</div><div style="flex:1;background:#E5E7EB;border-radius:6px;height:22px;overflow:hidden;"><div style="height:100%;background:'+color+';width:'+pct+'%;border-radius:6px;transition:width .3s;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:11px;font-weight:600;">'+count+'人 ('+pct+'%)</div></div></div>';
  });
  html += '</div></div>';

  // performance distribution
  html += '<div class="panel"><div class="panel-header"><span>📈 绩效分布</span></div><div class="panel-body">';
  html += '<div style="display:flex;gap:12px;">';
  [['高绩效',highPerf,'#2D6A4F'],['中绩效',midPerf,'#B85C14'],['低绩效',lowPerf,'#9B2335'],['缺失',total-highPerf-midPerf-lowPerf,'#9CA3AF']].forEach(([l,c,clr]) => {
    const pct = total?Math.round(c/total*100):0;
    html += '<div style="flex:1;text-align:center;background:var(--bg-warm);border-radius:8px;padding:16px;"><div style="font-size:24px;font-weight:700;color:'+clr+';">'+c+'</div><div style="font-size:12px;color:var(--text-light);margin-top:4px;">'+l+' ('+pct+'%)</div></div>';
  });

  html += '<div class="panel"><div class="panel-header"><span>⚠️ 离职风险预警</span><span style="font-size:12px;color:var(--text-light);">基于ELT观察+HRBP数据综合计算</span></div><div class="panel-body">';
  html += '<div style="display:flex;gap:12px;margin-bottom:16px;">';
  html += '<div style="flex:1;text-align:center;background:#FEE2E2;border-radius:8px;padding:16px;"><div style="font-size:24px;font-weight:700;color:var(--danger);">'+highRisk+'</div><div style="font-size:12px;color:var(--danger);">高风险</div></div>';
  html += '<div style="flex:1;text-align:center;background:#FEF3C7;border-radius:8px;padding:16px;"><div style="font-size:24px;font-weight:700;color:var(--warning);">'+midRisk+'</div><div style="font-size:12px;color:var(--warning);">中风险</div></div>';
  html += '<div style="flex:1;text-align:center;background:#DCFCE7;border-radius:8px;padding:16px;"><div style="font-size:24px;font-weight:700;color:var(--success);">'+(total-highRisk-midRisk)+'</div><div style="font-size:12px;color:var(--success);">低风险</div></div>';
  html += '</div>';

  const riskList = csvData.map(d => { const hs=getHrbpScore(d.empId); const r=getRiskLevel(d.riskTotal,hs); return {...d,combined:d.riskTotal+hs,riskLevel:r.level,riskCls:r.cls}; }).filter(d=>d.riskLevel!=='低风险').sort((a,b)=>b.combined-a.combined);
  if (riskList.length) {

  // dept comparison
  const deptMap = {};

  html += '<div class="panel"><div class="panel-header"><span>🏢 部门人才对比</span></div><div class="panel-body">';
  html += '<table class="data-table"><thead><tr><th>部门</th><th>人数</th><th>⭐星星</th><th>高潜占比</th><th>高风险</th></tr></thead><tbody>';
  Object.entries(deptMap).sort((a,b)=>b[1].count-a[1].count).forEach(([dept,d]) => {

  });
  html += '</tbody></table></div></div>';

  document.getElementById('contentArea').innerHTML = html;
};

/* ===== DEV: IDP (post-calibration development plan table) ===== */
function getIdpCandidates() {
  const cfg = getConfig();
  const isTalent = d => (d.perfLevel==='\u9ad8'&&d.potTotal>=cfg.potThresholdHigh) || (d.perfLevel==='\u4e2d'&&d.potTotal>=cfg.potThresholdHigh) || (d.perfLevel==='\u9ad8'&&d.potTotal>=cfg.potThresholdMid&&d.potTotal<cfg.potThresholdHigh);
  const hasReady = d => (d.readiness1&&d.readiness1!=='na')||(d.readiness2&&d.readiness2!=='na')||(d.readiness3&&d.readiness3!=='na');
  if (csvData.length) {
    return csvData.filter(d => isTalent(d) || hasReady(d));
  }
  // local fallback: derive from savedAssessments when no CSV has been round-tripped
  return savedAssessments.filter(a => (a.potTotal||0) >= cfg.potThresholdMid).map(a => ({
    empId:a.empId, empName:a.empName, empDept:a.empDept, empPosition:a.empPosition,
    perfLevel:a.perfLevel, potTotal:a.potTotal||0, riskTotal:a.riskTotal||0,
    strengths:a.strengths||'', gaps:a.gaps||'', devPlan:a.devPlan||'',
    readiness1:'na', readiness2:'na', readiness3:'na'
  }));
}

function toggleIdpRow(empId, btn) {

function saveIdp(empId) {
  devPlans[empId] = {
    goals: val('idpGoals_'+empId), actions: val('idpActions_'+empId),
    mentor: val('idpMentor_'+empId), metric: val('idpMetric_'+empId),
    notes: val('idpNotes_'+empId), updatedAt: new Date().toISOString()
  };
  saveAllData(); logOp('\u4fdd\u5b58\u53d1\u5c55\u8ba1\u5212: '+empId);
  showToast('\u53d1\u5c55\u8ba1\u5212\u5df2\u4fdd\u5b58\uff01');

function exportIdp() {
  const list = getIdpCandidates();
  if (!list.length) { showToast('\u6682\u65e0\u53d1\u5c55\u8ba1\u5212\u6570\u636e'); return; }
  const headers = ['\u59d3\u540d','\u804c\u4f4d','\u90e8\u95e8','\u4e5d\u5bab\u683c\u5b9a\u4f4d','\u6f5c\u529b\u5206','\u4f18\u52bf','\u5f85\u63d0\u5347','\u8bc4\u4f30\u5efa\u8bae','\u53d1\u5c55\u76ee\u6807','\u884c\u52a8\u63aa\u65bd','\u5bfc\u5e08','\u6210\u529f\u8861\u91cf','\u5907\u6ce8'];
  const rows = list.map(d => {
    const plan = devPlans[d.empId]||{};
    const key = manualMoves[d.empId]?(manualMoves[d.empId].pot+'_'+manualMoves[d.empId].perf):getMatrixKey(d.perfLevel,d.potTotal);
    const a = savedAssessments.find(x=>x.empId===d.empId)||{};
    return [d.empName,d.empPosition,d.empDept,getMatrixLabel(key),d.potTotal,d.strengths||a.strengths||'',d.gaps||a.gaps||'',d.devPlan||a.devPlan||'',plan.goals||'',plan.actions||'',plan.mentor||'',plan.metric||'',plan.notes||''];
  });
  const csv = [headers.join(','), ...rows.map(r => r.map(c => '"'+String(c).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '\u53d1\u5c55\u8ba1\u5212_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  logOp('\u5bfc\u51fa\u53d1\u5c55\u8ba1\u5212');
  showToast('\u5df2\u5bfc\u51fa\u53d1\u5c55\u8ba1\u5212\uff01');
}

function readEmbeddedData() {
  const tag = document.getElementById('tr-embedded-data');
  if (tag && tag.textContent.trim()) {
    try {
      const d = JSON.parse(tag.textContent);
      if (d.config) { ACTIVE_CONFIG = d.config; saveConfig(d.config); }
      if (d.employees) { employees = d.employees; eltList = d.eltList||[]; reportingMap = d.reportingMap||{}; evaluatorPasswords = d.evaluatorPasswords||{}; saveAllData(); }
      console.log('Loaded embedded data: '+((d.employees||[]).length)+' employees');
    } catch(e) { console.error('embedded data parse error:', e); }
  }
}

var _guideSteps = [];

function startGuide(steps) {

function showGuideStep() {
  var ex = document.getElementById('guideOverlay');
  if (ex) ex.remove();
  if (_guideIdx >= _guideSteps.length) { localStorage.setItem('kelly_trp_guide_done_'+currentRole,'1'); return; }
  var step = _guideSteps[_guideIdx];
  var ov = document.createElement('div');
  ov.id = 'guideOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:500;';
  var tgt = step.selector ? document.querySelector(step.selector) : null;
  var rect = tgt ? tgt.getBoundingClientRect() : null;
  if (rect && rect.width > 0) {
    var box = document.createElement('div');
    var pad = 6;
    box.style.cssText = 'position:fixed;left:'+(rect.left-pad)+'px;top:'+(rect.top-pad)+'px;width:'+(rect.width+pad*2)+'px;height:'+(rect.height+pad*2)+'px;border:3px solid #C9A227;border-radius:8px;box-shadow:0 0 0 9999px rgba(15,31,58,0.55);cursor:pointer;transition:all .2s;';
    box.onclick = function(){ nextGuideStep(); };
    ov.appendChild(box);
    var tip = document.createElement('div');
    var tipL = Math.max(16, Math.min(rect.left, window.innerWidth - 380));
    var tipT = rect.bottom + 14;
    if (tipT + 140 > window.innerHeight) tipT = Math.max(16, rect.top - 140);
    tip.style.cssText = 'position:fixed;left:'+tipL+'px;top:'+tipT+'px;max-width:360px;background:#fff;border-radius:10px;padding:18px 22px;box-shadow:0 8px 32px rgba(0,0,0,.25);z-index:501;';
    tip.innerHTML = '<div style="font-size:11px;color:#9CA3AF;margin-bottom:4px;">\u6B65\u9AA4 '+(_guideIdx+1)+' / '+_guideSteps.length+'</div>'+
      '<div style="font-size:15px;font-weight:700;color:#0F1F3A;line-height:1.4;">'+step.title+'</div>'+
      (step.desc?'<div style="font-size:13px;color:#6B7280;margin-top:8px;line-height:1.7;">'+step.desc+'</div>':'')+
      '<div style="margin-top:14px;display:flex;gap:12px;align-items:center;">'+
      '<button class="btn btn-sm btn-primary" onclick="nextGuideStep()">'+(_guideIdx<_guideSteps.length-1?'\u4E0B\u4E00\u6B65 \u2192':'\u5B8C\u6210 \u2713')+'</button>'+
      '<span style="font-size:11px;color:#9CA3AF;cursor:pointer;text-decoration:underline;" onclick="skipGuide()">\u8DF3\u8FC7\u5F15\u5BFC</span></div>';
    ov.appendChild(tip);
  } else {
    ov.style.background = 'rgba(15,31,58,0.55)';
    ov.style.display = 'flex';
    ov.style.alignItems = 'center';
    ov.style.justifyContent = 'center';
    var dlg = document.createElement('div');
    dlg.style.cssText = 'max-width:440px;background:#fff;border-radius:14px;padding:28px;box-shadow:0 12px 48px rgba(0,0,0,.3);margin:20px;';
    dlg.innerHTML = '<div style="font-size:11px;color:#9CA3AF;margin-bottom:4px;">\u6B65\u9AA4 '+(_guideIdx+1)+' / '+_guideSteps.length+'</div>'+
      '<div style="font-size:17px;font-weight:700;color:#0F1F3A;line-height:1.4;">'+step.title+'</div>'+
      (step.desc?'<div style="font-size:13px;color:#6B7280;margin-top:10px;line-height:1.8;">'+step.desc+'</div>':'')+
      '<div style="margin-top:18px;display:flex;gap:12px;align-items:center;">'+
      '<button class="btn btn-sm btn-primary" onclick="nextGuideStep()">'+(_guideIdx<_guideSteps.length-1?'\u4E0B\u4E00\u6B65 \u2192':'\u5B8C\u6210 \u2713')+'</button>'+
      '<span style="font-size:11px;color:#9CA3AF;cursor:pointer;text-decoration:underline;" onclick="skipGuide()">\u8DF3\u8FC7\u5F15\u5BFC</span></div>';
    ov.appendChild(dlg);
  }
  document.body.appendChild(ov);
}
function nextGuideStep() {
  _guideIdx++;

    var step = _guideSteps[_guideIdx];
    if (step.navigate) { navigate(step.navigate); }
    setTimeout(showGuideStep, step.navigate ? 200 : 50);
  } else {
    var ov = document.getElementById('guideOverlay');
    if (ov) ov.remove();
    localStorage.setItem('kelly_trp_guide_done_'+currentRole, '1');
    showToast('\u5F15\u5BFC\u5B8C\u6210\uFF01');
  }
}
